<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cozinha">
<link rel="apple-touch-icon" href="icone.png">
<title>Painel da Cozinha</title>
<style>
  /* Feito para o Safari do iOS 9 (iPad 2): flexbox com prefixo, animações -webkit- */
  * { box-sizing: border-box; -webkit-box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #efebe5; color: #1d1b19;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-user-select: none; -webkit-tap-highlight-color: rgba(0,0,0,0);
    overflow: hidden;
  }
  .wrap { display: -webkit-flex; display: flex; height: 100%; padding: 22px 22px 20px; }
  .col { display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; }
  .col-esq { width: 566px; padding-right: 16px; }
  .col-dir { -webkit-flex: 1; flex: 1; min-width: 0; }

  .card { background: #fff; border-radius: 26px; padding: 14px 18px; margin-bottom: 12px;
          box-shadow: 0 6px 20px rgba(60,40,20,.06); }
  .titulo { font-size: 15px; font-weight: bold; color: #1d1b19; margin-bottom: 8px; }

  /* ===== herói com a Lari ===== */
  .hero { position: relative; height: 438px; margin-top: 30px; border-radius: 32px; padding: 30px 30px 0;
          background: #e6e8dd;
          background: -webkit-linear-gradient(-30deg, #e3e7dc 0%, #ece2d3 45%, #f6d6b8 80%, #e9cfe0 100%);
          box-shadow: 0 8px 26px rgba(60,40,20,.08); }
  .hero-oi { font-size: 54px; font-weight: bold; letter-spacing: -2px; line-height: 1.02; width: 280px; }
  .hero-data { font-size: 18px; color: #5f5850; margin-top: 10px; }
  .hero-frase { font-size: 17px; line-height: 1.35; margin-top: 12px; width: 300px; color: #3a352f; }
  .hero-frase.niver { background: #1d1b19; color: #fff; border-radius: 16px; padding: 8px 12px; }
  .avatar { position: absolute; right: -4px; top: -34px; width: 256px; height: 315px;
            -webkit-animation: respira 4.5s ease-in-out infinite; -webkit-transform-origin: 50% 100%; }
  .avatar.pula { -webkit-animation: pulinho .9s ease-out 1; }
  .stats { position: absolute; left: 12px; right: 12px; bottom: 12px; background: #fff; border-radius: 24px;
           padding: 14px 20px 12px; display: -webkit-flex; display: flex; box-shadow: 0 4px 16px rgba(60,40,20,.06); }
  .st { -webkit-flex: 1; flex: 1; }
  .st + .st { padding-left: 16px; }
  .st-rot { font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; }
  .st-num { font-size: 50px; font-weight: bold; letter-spacing: -2px; line-height: 1.1; white-space: nowrap; }
  .st-num small { font-size: 17px; letter-spacing: 0; font-weight: bold; vertical-align: 24px; margin-left: 4px; }
  .rosa { color: #e2566b; } .azul { color: #4d8fd6; }
  .st-sub { font-size: 13px; color: #8b847c; white-space: nowrap; overflow: hidden; }

  /* ===== tarefa sorteada ===== */
  .tarefa { -webkit-flex: 1; flex: 1; margin-top: 12px; margin-bottom: 0; padding: 16px 20px; }
  .tf-topo { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; }
  .tf-topo .titulo { -webkit-flex: 1; flex: 1; margin-bottom: 0; }
  .dado { font-size: 26px; display: inline-block; }
  .dado.rola { -webkit-animation: rola .7s ease-out 1; }
  .tf-txt { font-size: 24px; font-weight: bold; letter-spacing: -.5px; line-height: 1.2; margin: 10px 0 10px; }
  .tf-txt .emo { margin-right: 8px; }
  .tf-msg { font-size: 15px; color: #8b847c; margin: -4px 0 12px; }
  .pill { display: inline-block; border-radius: 14px; font-size: 16px; font-weight: bold; padding: 12px 18px; margin-right: 8px;
          background: #f1ede8; color: #1d1b19; }
  .pill.preta { background: #1d1b19; color: #fff; }
  .pill.verdinha { background: #2f9b6a; color: #fff; }
  .pill:active { opacity: .7; }

  /* ===== timer ===== */
  .timer { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; padding: 10px 14px; }
  .t-icone { font-size: 24px; margin-right: 8px; }
  .t-tempo { font-size: 34px; font-weight: bold; letter-spacing: -1px; -webkit-flex: 1; flex: 1; }
  .btn { display: inline-block; background: #f1ede8; color: #1d1b19; border-radius: 12px;
         font-size: 15px; font-weight: bold; padding: 10px 7px; margin-left: 5px; min-width: 38px; text-align: center; }
  .btn:active { opacity: .7; }
  .btn.play { background: #1d1b19; color: #fff; }
  .timer.rodando .t-tempo { color: #e2566b; }
  .timer.rodando .t-icone { -webkit-animation: balanca 1s ease-in-out infinite; }

  /* ===== horas ===== */
  .horas { display: -webkit-flex; display: flex; padding: 10px 10px; }
  .h { -webkit-flex: 1; flex: 1; text-align: center; }
  .h .hh { font-size: 12px; color: #8b847c; }
  .h .hi { font-size: 20px; margin: 2px 0; }
  .h .ht { font-size: 16px; font-weight: bold; }
  .h .hc { font-size: 11px; color: #4d8fd6; }

  /* ===== k-pop ===== */
  .kpop-topo { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; margin-bottom: 4px; }
  .kpop-topo .titulo { margin-bottom: 0; -webkit-flex: 1; flex: 1; }
  .coracao { font-size: 18px; display: inline-block; -webkit-animation: bate 1.4s ease-in-out infinite; }
  .ev { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; padding: 4px 0; }
  .ev-quando { font-size: 12px; font-weight: bold; color: #fff; background: #1d1b19; border-radius: 9px;
               padding: 3px 7px; margin-right: 8px; min-width: 66px; text-align: center; -webkit-flex-shrink: 0; flex-shrink: 0; }
  .ev-quando.hoje { background: #ff6f9a; -webkit-animation: pisca 1.5s ease-in-out infinite; }
  .ev-txt { font-size: 14px; line-height: 1.25; }
  .sep { height: 1px; background: #eee8e1; margin: 6px 0 4px; }
  .nt { padding: 4px 0; font-size: 14px; line-height: 1.3; }
  .tag { display: inline-block; font-size: 10px; font-weight: bold; letter-spacing: 1px; border-radius: 6px;
         padding: 2px 5px; margin-right: 5px; color: #fff; vertical-align: 1px; }
  .tag-ateez { background: #f08a4b; } .tag-skz { background: #e2566b; } .tag-bts { background: #8f6ad6; }
  .kpop-atual { font-size: 10px; color: #b3aca4; margin-top: 2px; text-align: right; }

  /* ===== avisos ===== */
  .avisos { background: #1d1b19; color: #fff; }
  .avisos .titulo { color: #fff; }
  .aviso { padding: 5px 0; display: -webkit-flex; display: flex; }
  .aviso .ponto { width: 8px; height: 8px; border-radius: 4px; background: #ffb86b; margin: 6px 9px 0 0;
                  -webkit-flex-shrink: 0; flex-shrink: 0; -webkit-animation: pisca 2s ease-in-out infinite; }
  .aviso .at { font-size: 15px; line-height: 1.3; }
  .aviso .aq { font-size: 11px; color: #a49d95; margin-top: 1px; }

  /* ===== lista ===== */
  .lista-card { -webkit-flex: 1; flex: 1; display: -webkit-flex; display: flex;
                -webkit-flex-direction: column; flex-direction: column; margin-bottom: 0; min-height: 120px; }
  .add { display: -webkit-flex; display: flex; margin-bottom: 4px; }
  .add input { -webkit-flex: 1; flex: 1; min-width: 0; font-size: 16px; padding: 9px 12px; border-radius: 12px;
               border: none; background: #f1ede8; color: #1d1b19; -webkit-appearance: none; outline: none; }
  .itens { -webkit-flex: 1; flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .item { font-size: 17px; padding: 7px 2px; border-bottom: 1px solid #f1ede8; }
  .item.feito { color: #b3aca4; text-decoration: line-through; }
  .vazio { color: #b3aca4; font-size: 14px; padding: 6px 2px; }
  .limpar { font-size: 12px; color: #8b847c; text-align: right; padding-top: 4px; }

  /* ===== noite, apagado, alarme ===== */
  #noite { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #000; opacity: .55;
           z-index: 8; pointer-events: none; }
  #apagado { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #000; z-index: 9; }
  #alarme { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: #e2566b; color: #fff; text-align: center; z-index: 10; padding-top: 190px; }
  #alarme .a0 { font-size: 90px; display: inline-block; -webkit-animation: balanca .5s ease-in-out infinite; }
  #alarme .a1 { font-size: 58px; font-weight: bold; letter-spacing: -1px; margin-top: 10px; }
  #alarme .a2 { font-size: 22px; margin-top: 14px; opacity: .85; }

  .confete { position: fixed; top: -30px; font-size: 22px; z-index: 6; pointer-events: none; -webkit-animation: cai 9s linear infinite; }
  .neve { position: fixed; top: -30px; font-size: 16px; z-index: 5; pointer-events: none; opacity: .6; -webkit-animation: cai 16s linear infinite; }

  @-webkit-keyframes respira { 0%,100% { -webkit-transform: translateY(0) rotate(0); } 50% { -webkit-transform: translateY(-6px) rotate(-1.5deg); } }
  @-webkit-keyframes pulinho { 0% { -webkit-transform: translateY(0) scale(1); } 25% { -webkit-transform: translateY(-26px) scale(1.04) rotate(-4deg); }
                               50% { -webkit-transform: translateY(0) scale(.98); } 70% { -webkit-transform: translateY(-9px) rotate(3deg); } 100% { -webkit-transform: translateY(0); } }
  @-webkit-keyframes rola { 0% { -webkit-transform: rotate(0) scale(1); } 60% { -webkit-transform: rotate(540deg) scale(1.3); } 100% { -webkit-transform: rotate(720deg) scale(1); } }
  @-webkit-keyframes bate { 0%,100% { -webkit-transform: scale(1); } 15% { -webkit-transform: scale(1.25); } 30% { -webkit-transform: scale(1); } 45% { -webkit-transform: scale(1.18); } }
  @-webkit-keyframes balanca { 0%,100% { -webkit-transform: rotate(-12deg); } 50% { -webkit-transform: rotate(12deg); } }
  @-webkit-keyframes pisca { 0%,100% { opacity: 1; } 50% { opacity: .45; } }
  @-webkit-keyframes cai { 0% { -webkit-transform: translateY(0) rotate(0); } 100% { -webkit-transform: translateY(820px) rotate(360deg); } }
</style>
</head>
<body>
<div class="wrap">
  <div class="col col-esq">
    <div class="hero">
      <div class="hero-oi" id="oi">Bom dia, Lari!</div>
      <div class="hero-data" id="data"></div>
      <div class="hero-frase" id="frase"></div>
      <img class="avatar" id="avatar" src="lari.png" alt="">
      <div class="stats">
        <div class="st">
          <div class="st-rot">Agora</div>
          <div class="st-num" id="hora">--:--</div>
          <div class="st-sub" id="extraHora"></div>
        </div>
        <div class="st">
          <div class="st-rot" id="cDesc">Clima</div>
          <div class="st-num"><span id="cTemp">--°</span><small id="cIcone"></small></div>
          <div class="st-sub" id="cExtra"></div>
        </div>
        <div class="st">
          <div class="st-rot">Chuva</div>
          <div class="st-num"><span id="cChuva">--</span><small class="azul">%</small></div>
          <div class="st-sub" id="cDica"></div>
        </div>
      </div>
    </div>

    <div class="card tarefa">
      <div class="tf-topo"><div class="titulo">Tarefinha do dia</div><div class="dado" id="dado">🎲</div></div>
      <div id="tfCorpo"></div>
    </div>
  </div>

  <div class="col col-dir">
    <div class="card timer" id="timer">
      <div class="t-icone">⏲</div>
      <div class="t-tempo" id="tTempo">00:00</div>
      <div class="btn" data-a="1">+1</div><div class="btn" data-a="5">+5</div><div class="btn" data-a="10">+10</div>
      <div class="btn play" id="tPlay" data-a="play">▶︎</div><div class="btn" data-a="zero">✕</div>
    </div>

    <div class="card horas" id="horas"></div>

    <div class="card">
      <div class="kpop-topo"><div class="titulo">K-pop</div><div class="coracao">💜</div></div>
      <div id="eventos"></div>
      <div class="sep" id="kSep"></div>
      <div id="noticias"></div>
      <div class="kpop-atual" id="kAtual"></div>
    </div>

    <div class="card avisos" id="avisosCard" style="display:none">
      <div class="titulo">Avisos</div>
      <div id="avisos"></div>
    </div>

    <div class="card lista-card">
      <div class="titulo">Lista de compras</div>
      <div class="add">
        <input id="novoItem" type="text" placeholder="Adicionar item…" autocomplete="off" autocorrect="on">
        <div class="btn play" id="btnAdd">+</div>
      </div>
      <div class="itens" id="itens"></div>
      <div class="limpar" id="btnLimpar">Remover itens riscados</div>
    </div>
  </div>
</div>

<div id="confetes"></div>
<div id="neves"></div>
<div id="noite"></div>
<div id="apagado"></div>
<div id="alarme"><div class="a0">⏰</div><div class="a1">O timer acabou!</div><div class="a2">Toque para parar</div></div>

<script>
/* ======== CONFIGURAÇÃO ======== */
var CONFIG = {
  nome: "Lari",
  latitude: -19.92,
  longitude: -43.94,
  noiteDe: 22, noiteAte: 6,     // tela mais escura
  desligaDe: 1, desligaAte: 7   // tela preta (um toque acende por 1 minuto)
};

var ANIVERSARIOS = [
  ["02-18","J-Hope","bts"],["03-09","Suga","bts"],["09-01","Jungkook","bts"],["09-12","RM","bts"],
  ["10-13","Jimin","bts"],["12-04","Jin","bts"],["12-30","V","bts"],
  ["10-03","Bang Chan","skz"],["10-25","Lee Know","skz"],["08-11","Changbin","skz"],["03-20","Hyunjin","skz"],
  ["09-14","Han","skz"],["09-15","Felix","skz"],["09-22","Seungmin","skz"],["02-08","I.N","skz"],
  ["11-07","Hongjoong","ateez"],["04-03","Seonghwa","ateez"],["03-23","Yunho","ateez"],["06-15","Yeosang","ateez"],
  ["07-10","San","ateez"],["08-09","Mingi","ateez"],["11-26","Wooyoung","ateez"],["10-12","Jongho","ateez"]
];
var DEBUTS = [["06-13","BTS","bts",2013],["03-25","Stray Kids","skz",2018],["10-24","ATEEZ","ateez",2018]];
var GRUPOS = { bts: "BTS", skz: "SKZ", ateez: "ATEEZ" };

var FRASES = [
  "Hoje é um ótimo dia pra ser a protagonista. 🌟",
  "Água, comidinha boa e um K-pop no talo. Receita de felicidade. 🎶",
  "Você não está atrasada, está no seu tempo. 🐢",
  "Lembrete oficial: você é incrível. Assinado: a cozinha. 💛",
  "Pequenos passos ainda são passos. 👣",
  "O café não resolve tudo, mas ajuda bastante. ☕️",
  "Respira fundo. Você dá conta. 🌈",
  "Hoje vale dançar enquanto a água ferve. 💃",
  "Pausa pro lanchinho é autocuidado, sim. 🍪",
  "Plot twist: o dia vai ser bom. 🎬",
  "Hidrata, alonga e segue brilhando. ✨",
  "Coragem! Até o pão de queijo precisa do forno pra crescer. 🧀",
  "Se ninguém te disse hoje: você tá mandando bem. 👏",
  "Devagar também é velocidade. 🐌",
  "A melhor hora pra recomeçar é agora. 🌅",
  "Seja a energia de um fancam em 4K. 📸",
  "Hoje tem tudo pra ser leve. 🎈"
];
var TAREFAS_RESERVA = [{ tarefa: "Beber um copão de água", emoji: "💧" }, { tarefa: "Arrumar uma gaveta", emoji: "🗂" }];

/* JavaScript ES5 puro (sem let/const/arrow/fetch) para rodar no iOS 9 */
var DIAS = ["domingo","segunda-feira","terça-feira","quarta-feira","quinta-feira","sexta-feira","sábado"];
var MESES = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];

function $(id) { return document.getElementById(id); }
function dois(n) { return (n < 10 ? "0" : "") + n; }
function esc(t) { return String(t == null ? "" : t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function hojeISO(d) { d = d || new Date(); return d.getFullYear() + "-" + dois(d.getMonth() + 1) + "-" + dois(d.getDate()); }
function diaDoAno(d) { var ini = new Date(d.getFullYear(), 0, 1); return Math.floor((d - ini) / 86400000); }
function dataDe(iso) { var p = iso.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
function guardar(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function ler(k, padrao) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : padrao; } catch (e) { return padrao; } }
function toque(el, fn) {
  var mexeu = false;
  el.addEventListener("touchstart", function () { mexeu = false; }, false);
  el.addEventListener("touchmove", function () { mexeu = true; }, false);
  el.addEventListener("touchend", function (e) { if (!mexeu) { e.preventDefault(); fn(e); } }, false);
  el.addEventListener("click", fn, false);
}
function pegarJSON(url, ok, erro) {
  var xhr = new XMLHttpRequest();
  xhr.open("GET", url + (url.indexOf("?") < 0 ? "?" : "&") + "t=" + Date.now(), true);
  xhr.timeout = 15000;
  var feito = false;
  function falha() { if (!feito) { feito = true; if (erro) erro(); } }
  xhr.onreadystatechange = function () {
    if (xhr.readyState !== 4) return;
    if (xhr.status === 200) { try { var j = JSON.parse(xhr.responseText); feito = true; ok(j); return; } catch (e) {} }
    falha();
  };
  xhr.ontimeout = falha;
  try { xhr.send(); } catch (e) { falha(); }
}

/* ======== RELÓGIO E SAUDAÇÃO ======== */
var acordadoAte = 0, ultimoDia = "";
function relogio() {
  var d = new Date(), h = d.getHours(), ds = d.getDay();
  $("hora").innerHTML = dois(h) + ":" + dois(d.getMinutes());
  var dia = DIAS[ds];
  $("data").innerHTML = dia.charAt(0).toUpperCase() + dia.slice(1) + ", " + d.getDate() + " de " + MESES[d.getMonth()];
  var oi = h < 5 ? "Boa madrugada" : h < 12 ? "Bom dia" : h < 18 ? "Boa tarde" : "Boa noite";
  if (ds === 5 && h >= 12) oi = "Sextou";
  $("oi").innerHTML = oi + ", " + CONFIG.nome + "!";
  $("extraHora").innerHTML = ds === 5 ? "Sextou! 🎉" : (ds === 0 || ds === 6) ? "Fim de semana 🛋" : ds === 1 ? "Bora, segunda! 💪" : ds === 4 ? "Amanhã é sexta! 🙌" : "Faltam " + (5 - ds) + " dias pra sexta";

  $("noite").style.display = (h >= CONFIG.noiteDe || h < CONFIG.noiteAte) ? "block" : "none";
  var desligado = (h >= CONFIG.desligaDe && h < CONFIG.desligaAte);
  $("apagado").style.display = (desligado && !timer.rodando && !timer.fim && Date.now() > acordadoAte) ? "block" : "none";

  if (hojeISO(d) !== ultimoDia) { ultimoDia = hojeISO(d); desenharFrase(); desenharKpop(); desenharEstacao(); desenharTarefa(); }
}

/* ======== CLIMA ======== */
function climaInfo(cod) {
  if (cod === 0) return ["☀️", "Céu limpo"];
  if (cod === 1) return ["🌤", "Quase sem nuvens"];
  if (cod === 2) return ["⛅️", "Parcialmente nublado"];
  if (cod === 3) return ["☁️", "Nublado"];
  if (cod === 45 || cod === 48) return ["🌫", "Neblina"];
  if (cod >= 51 && cod <= 57) return ["🌦", "Garoa"];
  if (cod >= 61 && cod <= 67) return ["🌧", "Chuva"];
  if (cod >= 71 && cod <= 77) return ["❄️", "Neve"];
  if (cod >= 80 && cod <= 82) return ["🌧", "Pancadas de chuva"];
  if (cod >= 95) return ["⛈", "Trovoadas"];
  return ["🌡", "Clima"];
}
function urlOpenMeteo() {
  return "https://api.open-meteo.com/v1/forecast?latitude=" + CONFIG.latitude + "&longitude=" + CONFIG.longitude +
    "&current=temperature_2m,apparent_temperature,weather_code" +
    "&hourly=temperature_2m,weather_code,precipitation_probability" +
    "&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max" +
    "&timezone=America%2FSao_Paulo&forecast_days=2";
}
function atualizarClima() {
  pegarJSON("clima.json", mostrarClima, function () {
    pegarJSON(urlOpenMeteo(), mostrarClima, function () { $("cDesc").innerHTML = "Clima indisponível"; });
  });
}
function mostrarClima(j) {
  var c = j.current, info = climaInfo(c.weather_code), dd = j.daily;
  $("cIcone").innerHTML = info[0];
  $("cTemp").innerHTML = Math.round(c.temperature_2m) + "°";
  $("cDesc").innerHTML = info[1];
  var max = Math.round(dd.temperature_2m_max[0]), min = Math.round(dd.temperature_2m_min[0]);
  var chuva = dd.precipitation_probability_max[0] || 0;
  $("cExtra").innerHTML = '<span class="rosa">▲' + max + '°</span>  <span class="azul">▼' + min + "°</span>";
  $("cChuva").innerHTML = chuva;
  $("cDica").innerHTML = chuva >= 60 ? "Leva guarda-chuva ☔️" : chuva >= 35 ? "Pode pingar 🌂" :
             max >= 31 ? "Dia de picolé 🍦" : min <= 13 ? "Casaquinho e chá ☕️" : "Tempo firme 😎";

  var agora = new Date(), html = "", n = 0, hr = j.hourly, i;
  for (i = 0; i < hr.time.length && n < 6; i++) {
    var p = hr.time[i].split("T"), dp = p[0].split("-"), hp = +p[1].split(":")[0];
    var t = new Date(+dp[0], +dp[1] - 1, +dp[2], hp, 0, 0);
    if (t.getTime() <= agora.getTime() || hp % 3 !== 0) continue;
    var ii = climaInfo(hr.weather_code[i]), pc = hr.precipitation_probability[i];
    html += '<div class="h"><div class="hh">' + dois(hp) + 'h</div><div class="hi">' + ii[0] + '</div><div class="ht">' +
      Math.round(hr.temperature_2m[i]) + '°</div><div class="hc">' + (pc >= 20 ? pc + "%" : "&nbsp;") + "</div></div>";

/* ======== FRASE DO DIA E FESTAS ======== */
var DIA = null;
function atualizarDia() { pegarJSON("dia.json", function (j) { DIA = j; desenharFrase(); desenharKpop(); }); }
function aniversariantesHoje() {

  for (i = 0; i < ANIVERSARIOS.length; i++) if (ANIVERSARIOS[i][0] === md) r.push(ANIVERSARIOS[i][1] + " (" + GRUPOS[ANIVERSARIOS[i][2]] + ")");
  for (i = 0; i < DEBUTS.length; i++) if (DEBUTS[i][0] === md) r.push((d.getFullYear() - DEBUTS[i][3]) + " anos de debut do " + DEBUTS[i][1]);
  return r;
}

function chuvaDe(pecas, qtd, infinito) {

function desenharEstacao() {

/* ======== TAREFINHA SORTEADA (lista vem da planilha do Google) ======== */
var TAREFAS = [];
var tf = ler("tarefaDoDia", null);
function atualizarTarefas() {
  pegarJSON("tarefas.json", function (j) { TAREFAS = j.tarefas || []; desenharTarefa(); });
}
function sortear() {
  var lista = TAREFAS.length ? TAREFAS : TAREFAS_RESERVA, evitar = (tf && tf.dia === hojeISO() && tf.vistas) || [];
  var opcoes = [], i;
  for (i = 0; i < lista.length; i++) if (evitar.indexOf(lista[i].tarefa) < 0) opcoes.push(lista[i]);
  if (!opcoes.length) { opcoes = lista; evitar = []; }
  var t = opcoes[Math.floor(Math.random() * opcoes.length)];
  evitar.push(t.tarefa);
  tf = { dia: hojeISO(), estado: "sorteada", tarefa: t.tarefa, emoji: t.emoji || "✨", vistas: evitar };
  guardar("tarefaDoDia", tf);
  var dado = $("dado"); dado.className = "dado"; void dado.offsetWidth; dado.className = "dado rola";
  desenharTarefa();
}
function mudar(estado) { tf.estado = estado; guardar("tarefaDoDia", tf); desenharTarefa(); }
function botao(txt, classe, fn) {
  var b = document.createElement("div");
  b.className = "pill " + (classe || ""); b.innerHTML = txt; toque(b, fn);
  return b;
}
function desenharTarefa() {
  var box = $("tfCorpo");
  if (!box) return;
  box.innerHTML = "";
  if (!tf || tf.dia !== hojeISO()) tf = { dia: hojeISO(), estado: "inicio", vistas: [] };
  var txt = document.createElement("div"); txt.className = "tf-txt";
  var msg = document.createElement("div"); msg.className = "tf-msg";
  var linha = document.createElement("div");

    txt.innerHTML = nome;

    linha.appendChild(botao("Bora! ✓", "preta", function () { mudar("aceita"); }));
    linha.appendChild(botao("Outra 🎲", "", sortear));
    linha.appendChild(botao("Hoje não", "", function () { mudar("folga"); }));
  } else if (e === "aceita") {
    txt.innerHTML = nome;
    msg.innerHTML = "Combinado! Tô torcendo por você. 📣";
    linha.appendChild(botao("Feito! 🎉", "verdinha", function () {
      mudar("feita"); chuvaDe(["🎉","✨","💛","⭐️","🎊","👏"], 9, false); pularAvatar();
    }));
    linha.appendChild(botao("Trocar 🎲", "", sortear));
  } else if (e === "feita") {
    txt.innerHTML = "Arrasou! " + esc(tf.tarefa) + " ✓";

  } else {
    txt.innerHTML = "Tudo bem! Descansar também conta. 🛋";
    msg.innerHTML = "Se mudar de ideia, é só sortear de novo.";

/* ======== AVATAR ======== */
function pularAvatar() {

/* ======== K-POP ======== */
function quandoFalta(dias) { return dias === 0 ? "hoje!" : dias === 1 ? "amanhã" : "em " + dias + " dias"; }
function desenharKpop() {
  var hoje = dataDe(hojeISO()), lista = [], i, ano = hoje.getFullYear();
  function addFixo(md, txt, tipo) {
    var dt = dataDe(ano + "-" + md);
    if (dt < hoje) dt = dataDe((ano + 1) + "-" + md);
    var dias = Math.round((dt - hoje) / 86400000);
    if (dias <= 21) lista.push({ dias: dias, txt: txt, tipo: tipo });
  }
  for (i = 0; i < ANIVERSARIOS.length; i++) addFixo(ANIVERSARIOS[i][0], "Aniversário do " + ANIVERSARIOS[i][1] + " 🎂", ANIVERSARIOS[i][2]);
  for (i = 0; i < DEBUTS.length; i++) addFixo(DEBUTS[i][0], "Aniversário de debut do " + DEBUTS[i][1] + " 🎉", DEBUTS[i][2]);
  addFixo("12-25", "Natal! 🎄", ""); addFixo("01-01", "Ano-Novo! 🎆", "");
  var evs = (DIA && DIA.eventos) || [];
  for (i = 0; i < evs.length; i++) {
    if (!evs[i].data) continue;
    var dias = Math.round((dataDe(evs[i].data) - hoje) / 86400000);
    if (dias >= 0) lista.push({ dias: dias, txt: evs[i].texto, tipo: evs[i].grupo });
  }
  lista.sort(function (a, b) { return a.dias - b.dias; });
  var html = "";
  for (i = 0; i < lista.length && i < 3; i++) {
    var e = lista[i];
    html += '<div class="ev"><div class="ev-quando' + (e.dias === 0 ? " hoje" : "") + '">' + quandoFalta(e.dias) + '</div>' +
      '<div class="ev-txt">' + (GRUPOS[e.tipo] ? '<span class="tag tag-' + e.tipo + '">' + GRUPOS[e.tipo] + "</span>" : "") + esc(e.txt) + "</div></div>";
  }
  $("eventos").innerHTML = html;
  var nts = (DIA && DIA.noticias) || [];
  html = "";
  for (i = 0; i < nts.length && i < 3; i++) {
    var g = nts[i].grupo;
    html += '<div class="nt">' + (GRUPOS[g] ? '<span class="tag tag-' + g + '">' + GRUPOS[g] + "</span>" : "") + esc(nts[i].texto) + "</div>";
  }
  $("noticias").innerHTML = html;
  $("kSep").style.display = (lista.length && nts.length) ? "block" : "none";
  $("kAtual").innerHTML = "";
  if (nts.length && DIA.noticiasData) { var nd = DIA.noticiasData.split("-"); $("kAtual").innerHTML = "Notícias de " + nd[2] + "/" + nd[1]; }
}

/* ======== AVISOS ======== */
var vistos = ler("avisosVistos", {}), ultimosAvisos = [];
function quandoTxt(iso) {
  if (!iso) return "";
  var p = iso.split("T"), dp = p[0].split("-"), hp = (p[1] || "00:00").split(":");
  var d = new Date(+dp[0], +dp[1] - 1, +dp[2], +hp[0], +hp[1]);
  var hoje = new Date(), ontem = new Date(); ontem.setDate(hoje.getDate() - 1);
  var dia = d.toDateString() === hoje.toDateString() ? "hoje" :
            d.toDateString() === ontem.toDateString() ? "ontem" : d.getDate() + "/" + dois(d.getMonth() + 1);
  return dia + " às " + dois(d.getHours()) + ":" + dois(d.getMinutes());
}
function desenharAvisos() {

  box.innerHTML = "";

  for (i = 0; i < l.length && n < 2; i++) {

    (function (av) {
      var d = document.createElement("div");

      d.innerHTML = '<div class="ponto"></div><div><div class="at">' + esc(av.texto) + '</div><div class="aq">' +
        esc(quandoTxt(av.quando)) + " · toque pra marcar como visto</div></div>";
      toque(d, function () { vistos[av.id] = 1; guardar("avisosVistos", vistos); desenharAvisos(); });
      box.appendChild(d);

function atualizarAvisos() { pegarJSON("avisos.json", function (j) { ultimosAvisos = j.avisos || []; desenharAvisos(); }); }

/* ======== SOM ======== */
var audioCtx = null, bipando = null;
function liberarSom() {
  if (audioCtx) return;
  var AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  audioCtx = new AC();
  var o = audioCtx.createOscillator(), g = audioCtx.createGain();
  g.gain.value = 0; o.connect(g); g.connect(audioCtx.destination);
  if (o.start) o.start(0); else o.noteOn(0);
  if (o.stop) o.stop(audioCtx.currentTime + 0.05); else o.noteOff(audioCtx.currentTime + 0.05);
}
function bip() {
  if (!audioCtx) return;
  var agora = audioCtx.currentTime, k, notas = [784, 988, 1175];
  for (k = 0; k < 3; k++) {
    var o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.frequency.value = notas[k]; g.gain.value = 0.45;
    o.connect(g); g.connect(audioCtx.destination);
    var ini = agora + k * 0.22;
    if (o.start) o.start(ini); else o.noteOn(ini);
    if (o.stop) o.stop(ini + 0.16); else o.noteOff(ini + 0.16);
  }
}

/* ======== TIMER ======== */
var timer = { resta: 0, rodando: false, alvo: 0, fim: false };
function acaoTimer(a) {
  if (a === "play") {
    if (timer.rodando) { timer.resta = Math.max(0, timer.alvo - Date.now()); timer.rodando = false; }
    else if (timer.resta > 0) { timer.alvo = Date.now() + timer.resta; timer.rodando = true; }
  } else if (a === "zero") {
    timer.rodando = false; timer.resta = 0; timer.fim = false;
  } else {
    var mais = parseInt(a, 10) * 60000;
    if (timer.rodando) timer.alvo += mais; else timer.resta += mais;
  }
  desenharTimer();
}
function desenharTimer() {
  var ms = timer.rodando ? Math.max(0, timer.alvo - Date.now()) : timer.resta;
  var s = Math.ceil(ms / 1000), m = Math.floor(s / 60);
  $("tTempo").innerHTML = m >= 60 ? Math.floor(m / 60) + ":" + dois(m % 60) + ":" + dois(s % 60) : dois(m) + ":" + dois(s % 60);
  $("timer").className = "card timer" + (timer.rodando ? " rodando" : "");
  $("tPlay").innerHTML = timer.rodando ? "❚❚" : "▶︎";
}
function tickTimer() {
  if (timer.rodando && Date.now() >= timer.alvo) {
    timer.rodando = false; timer.resta = 0; timer.fim = true;
    $("alarme").style.display = "block";
    bip(); if (!bipando) bipando = setInterval(bip, 1400);
  }
  desenharTimer();
}
function pararAlarme() {
  $("alarme").style.display = "none";
  if (bipando) { clearInterval(bipando); bipando = null; }
  timer.fim = false; desenharTimer();
}

(function () {

  for (i = 0; i < btns.length; i++) (function (b) { toque(b, function () { liberarSom(); acaoTimer(b.getAttribute("data-a")); }); })(btns[i]);
