<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cozinha">
<link rel="apple-touch-icon" href="icone.png">
<title>Painel da Cozinha</title>
<style>
  /* Feito para o Safari do iOS 9 (iPad 2): flexbox com prefixo, animações e transições -webkit- */
  * { box-sizing: border-box; -webkit-box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #dcdcdf; background: -webkit-linear-gradient(top, #e6e6e8, #cfd0d3);
    color: #121520; font-family: "Avenir Next", "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-user-select: none; -webkit-tap-highlight-color: rgba(0,0,0,0); overflow: hidden; padding: 14px;
  }
  .flex { display: -webkit-flex; display: flex; }
  .col { -webkit-flex-direction: column; flex-direction: column; }
  .centro { -webkit-align-items: center; align-items: center; }
  .cresce { -webkit-flex: 1; flex: 1; min-width: 0; }
  .moldura { height: 100%; background: #fff; border-radius: 34px; padding: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.08); }
  .linha-topo { height: 404px; }
  .linha-baixo { height: 286px; margin-top: 12px; }
  .card { border-radius: 26px; background: #e9e9ec; padding: 18px 20px; position: relative; overflow: hidden; }
  .gap { margin-left: 12px; }
  .t1 { font-size: 18px; font-weight: 600; }
  .t2 { font-size: 13px; color: #7c7f88; margin-top: 1px; }
  .branco .t2 { color: rgba(255,255,255,.75); }

  /* ===== porta-retrato ===== */
  .hero { border-radius: 26px; position: relative; overflow: hidden; background: #d9cfc2;
          background: -webkit-linear-gradient(-30deg, #e8e1d6, #d8cbbb 60%, #cdbfae); }
  .foto { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background-size: cover; background-position: center 30%;
          opacity: 0; -webkit-transition: opacity 1.6s ease-in-out; }
  .foto.vis { opacity: 1; }
  .sombra { position: absolute; left: 0; right: 0; bottom: 0; height: 190px;
            background: -webkit-linear-gradient(top, rgba(0,0,0,0), rgba(0,0,0,.5)); }
  .hero.sem-foto .sombra { display: none; }
  .chips { position: absolute; top: 16px; left: 16px; right: 16px; }
  .chip { display: inline-block; border-radius: 22px; padding: 9px 16px; font-size: 16px; font-weight: 600;
          background: rgba(240,236,230,.82); -webkit-backdrop-filter: blur(10px); margin-left: 8px; white-space: nowrap; }
  .chip.vivo { background: #fff; margin-left: 0; }
  .ponto { display: inline-block; width: 9px; height: 9px; border-radius: 5px; background: #e5484d; margin-right: 8px; vertical-align: 1px;
           -webkit-animation: pisca 2s ease-in-out infinite; }
  .hero-txt { position: absolute; left: 24px; right: 24px; bottom: 20px; color: #fff; text-shadow: 0 1px 8px rgba(0,0,0,.35); }
  .hero.sem-foto .hero-txt { color: #121520; text-shadow: none; bottom: 26px; }
  .h-oi { font-size: 34px; font-weight: 600; letter-spacing: -.5px; }
  .h-frase { font-size: 18px; line-height: 1.35; margin-top: 4px; max-width: 520px; }
  .h-frase.niver { display: inline-block; background: rgba(255,255,255,.9); color: #121520; text-shadow: none; border-radius: 14px; padding: 6px 12px; }

  /* ===== próximos + lista ===== */
  .lado { width: 290px; padding: 18px 16px 16px; background: #e3e5ef;
          background: -webkit-linear-gradient(top, #dfe2ee 0%, #e9e8ea 55%, #f4ecd8 100%); }
  .lado-topo { padding: 0 4px 12px; border-bottom: 1px solid rgba(18,21,32,.1); margin-bottom: 8px; }
  .row { padding: 8px 8px; border-radius: 30px; margin-bottom: 4px; }
  .row.ativo { background: #fff; box-shadow: 0 4px 14px rgba(0,0,0,.05); }
  .ic { width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,.75); text-align: center; line-height: 44px;
        font-size: 20px; margin-right: 12px; -webkit-flex-shrink: 0; flex-shrink: 0; }
  .row.ativo .ic { background: #f0f0f3; }
  .r1 { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .r2 { font-size: 12px; color: #7c7f88; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .seta { font-size: 18px; color: #121520; margin-left: 6px; }
  .botao-lista { position: absolute; left: 16px; right: 16px; bottom: 16px; background: #0f1424; color: #fff; border-radius: 26px;
                 text-align: center; font-size: 14px; font-weight: 600; letter-spacing: .6px; padding: 15px 0; }
  .botao-lista:active { opacity: .8; }
  #painelProx, #painelLista { position: absolute; top: 18px; left: 16px; right: 16px; bottom: 76px; }
  #painelLista { display: none; }
  .add { margin: 4px 0 6px; }
  .add input { -webkit-flex: 1; flex: 1; min-width: 0; font-size: 16px; padding: 10px 14px; border-radius: 20px; border: none;
               background: #fff; color: #121520; -webkit-appearance: none; outline: none; font-family: inherit; }
  .mais { width: 40px; height: 40px; border-radius: 20px; background: #0f1424; color: #fff; text-align: center; line-height: 40px;
          font-size: 22px; margin-left: 8px; }
  .itens { -webkit-flex: 1; flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .item { font-size: 16px; padding: 9px 6px; border-bottom: 1px solid rgba(18,21,32,.08); }
  .item.feito { color: #a3a6ae; text-decoration: line-through; }
  .vazio { color: #8f929a; font-size: 14px; padding: 8px 6px; }
  .limpar { font-size: 12px; color: #7c7f88; text-align: right; padding-top: 6px; }

  /* ===== tarefinha ===== */
  .tarefa { -webkit-flex: 1.45; flex: 1.45; }
  .dado { width: 46px; height: 46px; border-radius: 23px; background: #fff; text-align: center; line-height: 46px; font-size: 24px; }
  .dado.rola { -webkit-animation: rola .7s ease-out 1; }
  .tf-txt { font-size: 25px; font-weight: 600; letter-spacing: -.4px; line-height: 1.2; margin-top: 22px; }
  .tf-msg { font-size: 14px; color: #7c7f88; margin-top: 6px; }
  .pills { position: absolute; left: 16px; right: 10px; bottom: 16px; white-space: nowrap; }
  .pill { display: inline-block; background: #d9d9de; border-radius: 30px; padding: 5px 13px 5px 5px; margin-right: 6px; }
  .pill:active { opacity: .7; }
  .pill .pi { display: inline-block; width: 32px; height: 32px; border-radius: 16px; background: #fff; text-align: center; line-height: 32px;
              font-size: 15px; margin-right: 7px; vertical-align: middle; color: #121520; }
  .pill .pl { display: inline-block; font-size: 14px; font-weight: 600; vertical-align: middle; }
  .pill.escura { background: #0f1424; color: #fff; }

  /* ===== timer ===== */
  .timer { -webkit-flex: .95; flex: .95; background: #aab0bd; color: #fff; }
  .bola { width: 136px; height: 136px; border-radius: 68px; margin: 10px auto 0; text-align: center; line-height: 136px;
          font-size: 34px; font-weight: 600; color: #121520; letter-spacing: -.5px;
          background: #fbfaf7; background: -webkit-radial-gradient(40% 35%, circle, #ffffff 0%, #f4f1ea 60%, #dcd8d0 100%);
          box-shadow: 0 0 30px rgba(255,255,255,.6); }
  .timer.rodando .bola { color: #e5484d; }
  .timer.fim .bola { -webkit-animation: pulsa .6s ease-in-out infinite; }
  .ctrl { position: absolute; left: 14px; right: 14px; bottom: 14px; background: #fff; border-radius: 26px; padding: 5px; color: #121520; }
  .cb { -webkit-flex: 1; flex: 1; text-align: center; font-size: 15px; font-weight: 600; padding: 10px 0; border-radius: 20px; }
  .cb:active { background: #eee; }
  .cb.play { background: #0f1424; color: #fff; -webkit-flex: 1.1; flex: 1.1; }

  /* ===== clima ===== */
  .clima { -webkit-flex: 1; flex: 1; }
  .anel { position: relative; width: 150px; height: 150px; margin: 2px auto 0; }
  .anel svg { position: absolute; top: 0; left: 0; }
  .anel-dentro { position: absolute; top: 14px; left: 14px; width: 122px; height: 122px; border-radius: 61px; background: #fff;
                 text-align: center; padding-top: 24px; }
  .a-emo { font-size: 30px; line-height: 1; }
  .a-temp { font-size: 30px; font-weight: 600; margin-top: 4px; }
  .horas { position: absolute; left: 14px; right: 14px; bottom: 14px; }
  .hx { -webkit-flex: 1; flex: 1; text-align: center; font-size: 12px; color: #7c7f88; }
  .hx b { display: block; font-size: 15px; color: #121520; margin-top: 1px; }
  .hx.agora { background: #d9d9de; border-radius: 18px; padding: 4px 0; }

  /* ===== noite, apagado, alarme, confete ===== */
  #noite { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #000; opacity: .55; z-index: 8; pointer-events: none; }
  #apagado { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #000; z-index: 9; }
  #alarme { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #0f1424; color: #fff;
            text-align: center; z-index: 10; padding-top: 200px; }
  #alarme .a0 { font-size: 84px; display: inline-block; -webkit-animation: balanca .5s ease-in-out infinite; }
  #alarme .a1 { font-size: 52px; font-weight: 600; margin-top: 10px; }
  #alarme .a2 { font-size: 20px; margin-top: 12px; opacity: .7; }
  .confete { position: fixed; top: -30px; font-size: 22px; z-index: 6; pointer-events: none; -webkit-animation: cai 9s linear infinite; }
  .neve { position: fixed; top: -30px; font-size: 15px; z-index: 5; pointer-events: none; opacity: .6; -webkit-animation: cai 16s linear infinite; }

  @-webkit-keyframes pisca { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  @-webkit-keyframes rola { 0% { -webkit-transform: rotate(0) scale(1); } 60% { -webkit-transform: rotate(540deg) scale(1.25); } 100% { -webkit-transform: rotate(720deg) scale(1); } }
  @-webkit-keyframes balanca { 0%,100% { -webkit-transform: rotate(-12deg); } 50% { -webkit-transform: rotate(12deg); } }
  @-webkit-keyframes pulsa { 0%,100% { -webkit-transform: scale(1); } 50% { -webkit-transform: scale(1.06); } }
  @-webkit-keyframes cai { 0% { -webkit-transform: translateY(0) rotate(0); } 100% { -webkit-transform: translateY(820px) rotate(360deg); } }
</style>
</head>
<body>
<div class="moldura flex col">
  <div class="flex linha-topo">
    <div class="hero cresce sem-foto" id="hero">
      <div class="foto" id="fotoA"></div>
      <div class="foto" id="fotoB"></div>
      <div class="sombra"></div>
      <div class="chips flex">
        <div class="chip vivo"><span class="ponto"></span><span id="hora">--:--</span></div>
        <div class="cresce"></div>
        <div class="chip" id="chTemp">🌡 --°</div>
        <div class="chip" id="chChuva">☔️ --%</div>
        <div class="chip" id="chMax">▲--° ▼--°</div>
      </div>
      <div class="hero-txt">
        <div class="h-oi" id="oi">Bom dia, Lari</div>
        <div class="h-frase" id="frase"></div>
      </div>
    </div>

    <div class="card lado gap">
      <div id="painelProx" class="flex col">
        <div class="lado-topo flex centro"><div class="t1 cresce">Próximos</div><div class="t2" id="dataCurta"></div></div>
        <div id="rows"></div>
      </div>
      <div id="painelLista" class="flex col">
        <div class="lado-topo flex centro"><div class="t1 cresce">Lista de compras</div><div class="t2" id="contaLista"></div></div>
        <div class="add flex centro">
          <input id="novoItem" type="text" placeholder="Adicionar item…" autocomplete="off" autocorrect="on">
          <div class="mais" id="btnAdd">+</div>
        </div>
        <div class="itens" id="itens"></div>
        <div class="limpar" id="btnLimpar">Remover itens riscados</div>
      </div>
      <div class="botao-lista" id="botaoLista">🛒&nbsp; LISTA DE COMPRAS</div>
    </div>
  </div>

  <div class="flex linha-baixo">
    <div class="card tarefa">
      <div class="flex centro">
        <div class="cresce"><div class="t1">Tarefinha do dia</div><div class="t2">Sorteada da sua lista</div></div>
        <div class="dado" id="dado">🎲</div>
      </div>
      <div class="tf-txt" id="tfTxt"></div>
      <div class="tf-msg" id="tfMsg"></div>
      <div class="pills" id="tfPills"></div>
    </div>

    <div class="card timer gap branco" id="timer">
      <div class="t1">Timer</div><div class="t2">Da cozinha</div>
      <div class="bola" id="tTempo">00:00</div>
      <div class="ctrl flex">
        <div class="cb" data-a="1">+1</div><div class="cb" data-a="5">+5</div><div class="cb" data-a="10">+10</div>
        <div class="cb play" id="tPlay" data-a="play">▶︎</div><div class="cb" data-a="zero">✕</div>
      </div>
    </div>

    <div class="card clima gap">
      <div class="t1">Clima</div><div class="t2" id="cDesc">Belo Horizonte</div>
      <div class="anel">
        <svg width="150" height="150" viewBox="0 0 150 150">
          <circle cx="75" cy="75" r="70" fill="none" stroke="#d6d6db" stroke-width="3"/>
          <circle id="arco" cx="75" cy="75" r="70" fill="none" stroke="#121520" stroke-width="3" stroke-linecap="round"
                  stroke-dasharray="0 440" transform="rotate(-90 75 75)"/>
        </svg>
        <div class="anel-dentro"><div class="a-emo" id="cIcone">⛅️</div><div class="a-temp" id="cTemp">--°</div></div>
      </div>
      <div class="horas flex" id="horas"></div>
    </div>
  </div>
</div>

<div id="confetes"></div>
<div id="neves"></div>
<div id="noite"></div>
<div id="apagado"></div>
<div id="alarme"><div class="a0">⏰</div><div class="a1">O timer acabou!</div><div class="a2">Toque para parar</div></div>

<script>
/* ======== CONFIGURAÇÃO ======== */
var CONFIG = {
  nome: "Lari",
  latitude: -19.92, longitude: -43.94,
  noiteDe: 22, noiteAte: 6,      // tela mais escura
  desligaDe: 1, desligaAte: 7,   // tela preta (um toque acende por 1 minuto)
  trocaFoto: 45                  // segundos entre fotos do porta-retrato
};

var ANIVERSARIOS = [
  ["02-18","J-Hope","bts"],["03-09","Suga","bts"],["09-01","Jungkook","bts"],["09-12","RM","bts"],
  ["10-13","Jimin","bts"],["12-04","Jin","bts"],["12-30","V","bts"],
  ["10-03","Bang Chan","skz"],["10-25","Lee Know","skz"],["08-11","Changbin","skz"],["03-20","Hyunjin","skz"],
  ["09-14","Han","skz"],["09-15","Felix","skz"],["09-22","Seungmin","skz"],["02-08","I.N","skz"],
  ["11-07","Hongjoong","ateez"],["04-03","Seonghwa","ateez"],["03-23","Yunho","ateez"],["06-15","Yeosang","ateez"],
  ["07-10","San","ateez"],["08-09","Mingi","ateez"],["11-26","Wooyoung","ateez"],["10-12","Jongho","ateez"]
];
var DEBUTS = [["06-13","BTS","bts",2013],["03-25","Stray Kids","skz",2018],["10-24","ATEEZ","ateez",2018]];
var GRUPOS = { bts: "BTS", skz: "Stray Kids", ateez: "ATEEZ" };

var FRASES = [
  "Hoje é um ótimo dia pra ser a protagonista. 🌟",
  "Você não está atrasada, está no seu tempo. 🐢",
  "Lembrete oficial: você é incrível. Assinado: a cozinha. 💛",
  "Pequenos passos ainda são passos. 👣",
  "O café não resolve tudo, mas ajuda bastante. ☕️",
  "Respira fundo. Você dá conta. 🌈",
  "Hoje vale dançar enquanto a água ferve. 💃",
  "Plot twist: o dia vai ser bom. 🎬",
  "Coragem! Até o pão de queijo precisa do forno pra crescer. 🧀",
  "Devagar também é velocidade. 🐌",
  "Hoje tem tudo pra ser leve. 🎈"
];
var TAREFAS_RESERVA = [{ tarefa: "Beber um copão de água", emoji: "💧" }, { tarefa: "Arrumar uma gaveta", emoji: "🗂" }];

/* JavaScript ES5 puro (sem let/const/arrow/fetch) para rodar no iOS 9 */
var DIAS = ["domingo","segunda-feira","terça-feira","quarta-feira","quinta-feira","sexta-feira","sábado"];
var MES3 = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];

function $(id) { return document.getElementById(id); }
function dois(n) { return (n < 10 ? "0" : "") + n; }
function esc(t) { return String(t == null ? "" : t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function hojeISO(d) { d = d || new Date(); return d.getFullYear() + "-" + dois(d.getMonth() + 1) + "-" + dois(d.getDate()); }
function diaDoAno(d) { var ini = new Date(d.getFullYear(), 0, 1); return Math.floor((d - ini) / 86400000); }
function dataDe(iso) { var p = iso.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
function guardar(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function ler(k, padrao) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : padrao; } catch (e) { return padrao; } }
function toque(el, fn) {
  var mexeu = false;
  el.addEventListener("touchstart", function () { mexeu = false; }, false);
  el.addEventListener("touchmove", function () { mexeu = true; }, false);
  el.addEventListener("touchend", function (e) { if (!mexeu) { e.preventDefault(); fn(e); } }, false);
  el.addEventListener("click", fn, false);
}
function pegarJSON(url, ok, erro) {
  var xhr = new XMLHttpRequest();
  xhr.open("GET", url + (url.indexOf("?") < 0 ? "?" : "&") + "t=" + Date.now(), true);
  xhr.timeout = 15000;
  var feito = false;
  function falha() { if (!feito) { feito = true; if (erro) erro(); } }
  xhr.onreadystatechange = function () {
    if (xhr.readyState !== 4) return;
    if (xhr.status === 200) { try { var j = JSON.parse(xhr.responseText); feito = true; ok(j); return; } catch (e) {} }
    falha();
  };
  xhr.ontimeout = falha;
  try { xhr.send(); } catch (e) { falha(); }
}

/* ======== RELÓGIO E SAUDAÇÃO ======== */
var acordadoAte = 0, ultimoDia = "";
function relogio() {
  var d = new Date(), h = d.getHours(), ds = d.getDay();
  $("hora").innerHTML = dois(h) + ":" + dois(d.getMinutes());
  var oi = h < 5 ? "Boa madrugada" : h < 12 ? "Bom dia" : h < 18 ? "Boa tarde" : "Boa noite";
  if (ds === 5 && h >= 12) oi = "Sextou";
  $("oi").innerHTML = oi + ", " + CONFIG.nome;
  var dia = DIAS[ds];
  $("dataCurta").innerHTML = dia.charAt(0).toUpperCase() + dia.slice(1, 3) + ", " + d.getDate() + " " + MES3[d.getMonth()];

  $("noite").style.display = (h >= CONFIG.noiteDe || h < CONFIG.noiteAte) ? "block" : "none";
  var desligado = (h >= CONFIG.desligaDe && h < CONFIG.desligaAte);
  $("apagado").style.display = (desligado && !timer.rodando && !timer.fim && Date.now() > acordadoAte) ? "block" : "none";

  if (hojeISO(d) !== ultimoDia) { ultimoDia = hojeISO(d); desenharFrase(); desenharProximos(); desenharEstacao(); desenharTarefa(); }
}

/* ======== PORTA-RETRATO ======== */
var FOTOS = [], fotoIdx = -1, fotoVez = 0, ultimaTroca = 0;
function atualizarFotos() {
  pegarJSON("fotos.json", function (j) {
    var novas = j.fotos || [];
    if (novas.join("|") !== FOTOS.join("|")) { FOTOS = novas; embaralhar(FOTOS); fotoIdx = -1; proximaFoto(); }
  }, function () { if (!FOTOS.length) $("hero").className = "hero cresce sem-foto"; });
}
function embaralhar(a) { var i, j, t; for (i = a.length - 1; i > 0; i--) { j = Math.floor(Math.random() * (i + 1)); t = a[i]; a[i] = a[j]; a[j] = t; } }
function proximaFoto() {
  if (!FOTOS.length) { $("hero").className = "hero cresce sem-foto"; return; }
  fotoIdx = (fotoIdx + 1) % FOTOS.length;
  var url = FOTOS[fotoIdx], img = new Image();
  img.onload = function () {
    var entra = fotoVez ? $("fotoA") : $("fotoB"), sai = fotoVez ? $("fotoB") : $("fotoA");
    entra.style.backgroundImage = "url('" + url + "')";
    entra.className = "foto vis"; sai.className = "foto";
    $("hero").className = "hero cresce";
    fotoVez = 1 - fotoVez; ultimaTroca = Date.now();
  };
  img.src = url;
}

/* ======== CLIMA ======== */
function climaInfo(cod) {
  if (cod === 0) return ["☀️", "Céu limpo"];
  if (cod === 1) return ["🌤", "Quase sem nuvens"];
  if (cod === 2) return ["⛅️", "Parcialmente nublado"];
  if (cod === 3) return ["☁️", "Nublado"];
  if (cod === 45 || cod === 48) return ["🌫", "Neblina"];
  if (cod >= 51 && cod <= 57) return ["🌦", "Garoa"];
  if (cod >= 61 && cod <= 67) return ["🌧", "Chuva"];
  if (cod >= 71 && cod <= 77) return ["❄️", "Neve"];
  if (cod >= 80 && cod <= 82) return ["🌧", "Pancadas de chuva"];
  if (cod >= 95) return ["⛈", "Trovoadas"];
  return ["🌡", "Clima"];
}
function urlOpenMeteo() {

/* ======== FRASE DO DIA, FESTAS E ESTAÇÃO ======== */
var DIA = null;

/* ======== PRÓXIMOS (avisos, K-pop, datas) ======== */
var vistos = ler("avisosVistos", {}), ultimosAvisos = [];
function quandoFalta(dias) { return dias === 0 ? "Hoje" : dias === 1 ? "Amanhã" : "Em " + dias + " dias"; }
function desenharProximos() {
  var hoje = dataDe(hojeISO()), linhas = [], datas = [], i, ano = hoje.getFullYear();
  var av = ultimosAvisos.slice().sort(function (a, b) { return (b.quando || "") > (a.quando || "") ? 1 : -1; });
  for (i = 0; i < av.length; i++) if (av[i] && av[i].id && !vistos[av[i].id]) linhas.push({ ic: "🔔", t: av[i].texto, s: "Aviso · toque pra marcar como visto", aviso: av[i].id });
  function addFixo(md, txt, sub, ic) {
    var dt = dataDe(ano + "-" + md);
    if (dt < hoje) dt = dataDe((ano + 1) + "-" + md);
    var dias = Math.round((dt - hoje) / 86400000);
    if (dias <= 21) datas.push({ dias: dias, ic: ic, t: txt, s: sub });
  }
  for (i = 0; i < ANIVERSARIOS.length; i++) addFixo(ANIVERSARIOS[i][0], "Aniversário do " + ANIVERSARIOS[i][1], GRUPOS[ANIVERSARIOS[i][2]], "🎂");
  for (i = 0; i < DEBUTS.length; i++) addFixo(DEBUTS[i][0], "Debut do " + DEBUTS[i][1], "Aniversário de debut", "🎉");
  addFixo("12-25", "Natal", "Feliz Natal!", "🎄"); addFixo("01-01", "Ano-Novo", "Feliz ano novo!", "🎆");
  var evs = (DIA && DIA.eventos) || [];
  for (i = 0; i < evs.length; i++) {
    if (!evs[i].data) continue;
    var dias = Math.round((dataDe(evs[i].data) - hoje) / 86400000);
    if (dias >= 0) datas.push({ dias: dias, ic: "💜", t: evs[i].texto, s: GRUPOS[evs[i].grupo] || "K-pop" });
  }
  datas.sort(function (a, b) { return a.dias - b.dias; });
  for (i = 0; i < datas.length; i++) { datas[i].s = quandoFalta(datas[i].dias) + " · " + datas[i].s; linhas.push(datas[i]); }
  var nts = (DIA && DIA.noticias) || [];
  for (i = 0; i < nts.length; i++) linhas.push({ ic: "📰", t: nts[i].texto, s: "Notícia · " + (GRUPOS[nts[i].grupo] || "K-pop") });

  var box = $("rows"); box.innerHTML = "";
  for (i = 0; i < linhas.length && i < 4; i++) {
    (function (l, idx) {
      var r = document.createElement("div");
      r.className = "row flex centro" + ((idx === 0 && (l.aviso || l.dias === 0)) ? " ativo" : "");
      r.innerHTML = '<div class="ic">' + l.ic + '</div><div class="cresce"><div class="r1">' + esc(l.t) + '</div><div class="r2">' + esc(l.s) + '</div></div><div class="seta">›</div>';
      if (l.aviso) toque(r, function () { vistos[l.aviso] = 1; guardar("avisosVistos", vistos); desenharProximos(); });
      box.appendChild(r);
    })(linhas[i], i);
  }
  if (!linhas.length) box.innerHTML = '<div class="vazio">Nada por aqui. Dia tranquilo! 🍃</div>';
}
function atualizarAvisos() { pegarJSON("avisos.json", function (j) { ultimosAvisos = j.avisos || []; desenharProximos(); }); }

/* ======== TAREFINHA SORTEADA (lista vem da planilha do Google) ======== */
var TAREFAS = [], tf = ler("tarefaDoDia", null);
function atualizarTarefas() { pegarJSON("tarefas.json", function (j) { TAREFAS = j.tarefas || []; desenharTarefa(); }); }

    box.appendChild(pill("🎉", "Feito!", true, function () { mudar("feita"); chuvaDe(["🎉","✨","💛","⭐️","🎊","👏"], 9, false); }));

/* ======== SOM ======== */
var audioCtx = null, bipando = null;
function liberarSom() {
  if (audioCtx) return;
  var AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  audioCtx = new AC();
  var o = audioCtx.createOscillator(), g = audioCtx.createGain();
  g.gain.value = 0; o.connect(g); g.connect(audioCtx.destination);
  if (o.start) o.start(0); else o.noteOn(0);
  if (o.stop) o.stop(audioCtx.currentTime + 0.05); else o.noteOff(audioCtx.currentTime + 0.05);
}
function bip() {
  if (!audioCtx) return;
  var agora = audioCtx.currentTime, k, notas = [784, 988, 1175];
  for (k = 0; k < 3; k++) {
    var o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.frequency.value = notas[k]; g.gain.value = 0.45;
    o.connect(g); g.connect(audioCtx.destination);
    var ini = agora + k * 0.22;
    if (o.start) o.start(ini); else o.noteOn(ini);
    if (o.stop) o.stop(ini + 0.16); else o.noteOff(ini + 0.16);
  }
}

/* ======== TIMER ======== */
var timer = { resta: 0, rodando: false, alvo: 0, fim: false };
function acaoTimer(a) {
  if (a === "play") {
    if (timer.rodando) { timer.resta = Math.max(0, timer.alvo - Date.now()); timer.rodando = false; }
    else if (timer.resta > 0) { timer.alvo = Date.now() + timer.resta; timer.rodando = true; }
  } else if (a === "zero") {
    timer.rodando = false; timer.resta = 0; timer.fim = false;
  } else {
    var mais = parseInt(a, 10) * 60000;
    if (timer.rodando) timer.alvo += mais; else timer.resta += mais;
  }
  desenharTimer();
}
function desenharTimer() {
  var ms = timer.rodando ? Math.max(0, timer.alvo - Date.now()) : timer.resta;
  var s = Math.ceil(ms / 1000), m = Math.floor(s / 60);
  $("tTempo").innerHTML = m >= 60 ? Math.floor(m / 60) + ":" + dois(m % 60) + ":" + dois(s % 60) : dois(m) + ":" + dois(s % 60);
  $("timer").className = "card timer gap branco" + (timer.rodando ? " rodando" : "") + (timer.fim ? " fim" : "");
  $("tPlay").innerHTML = timer.rodando ? "❚❚" : "▶︎";
}
function tickTimer() {
  if (timer.rodando && Date.now() >= timer.alvo) {
    timer.rodando = false; timer.resta = 0; timer.fim = true;
    $("alarme").style.display = "block";
    bip(); if (!bipando) bipando = setInterval(bip, 1400);
  }
  desenharTimer();
}
function pararAlarme() {
  $("alarme").style.display = "none";
  if (bipando) { clearInterval(bipando); bipando = null; }
  timer.fim = false; desenharTimer();
}
