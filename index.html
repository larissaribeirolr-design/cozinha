<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cozinha">
<title>Painel da Cozinha</title>
<style>
  /* Feito para Safari do iOS 9 (iPad 2): sem CSS moderno, flexbox com prefixo */
  * { box-sizing: border-box; -webkit-box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #14110f; color: #f3ece4;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-user-select: none; -webkit-tap-highlight-color: rgba(0,0,0,0);
    overflow: hidden;
  }
  body.noite { background: #000; color: #8a7f74; }
  .wrap { display: -webkit-flex; display: flex; height: 100%; padding: 28px; }
  .col-esq { -webkit-flex: 1.25; flex: 1.25; display: -webkit-flex; display: flex;
             -webkit-flex-direction: column; flex-direction: column; padding-right: 28px; }
  .col-dir { -webkit-flex: 1; flex: 1; display: -webkit-flex; display: flex;
             -webkit-flex-direction: column; flex-direction: column; }

  .hora { font-size: 150px; font-weight: 200; letter-spacing: -4px; line-height: 1; }
  .hora .seg { font-size: 44px; color: #8d7f72; letter-spacing: 0; margin-left: 6px; }
  .data { font-size: 30px; font-weight: 300; color: #d9a46a; margin-top: 8px; }

  .clima { margin-top: 34px; }
  .clima-agora { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; }
  .clima-icone { font-size: 76px; margin-right: 18px; }
  .clima-temp { font-size: 76px; font-weight: 200; }
  .clima-desc { font-size: 22px; color: #b9aea3; margin-top: 2px; }
  .clima-extra { font-size: 19px; color: #8d7f72; margin-top: 6px; }
  .horas { display: -webkit-flex; display: flex; margin-top: 22px; }
  .h { -webkit-flex: 1; flex: 1; text-align: center; padding: 10px 0; border-radius: 14px; background: #201b18; margin-right: 8px; }
  .h:last-child { margin-right: 0; }
  .h .hh { font-size: 15px; color: #8d7f72; }
  .h .hi { font-size: 26px; margin: 4px 0; }
  .h .ht { font-size: 19px; }
  .h .hc { font-size: 13px; color: #6fa8d6; }
  .atualizado { font-size: 13px; color: #5e554d; margin-top: 10px; }

  .card { background: #201b18; border-radius: 20px; padding: 18px 20px; margin-bottom: 18px; }
  .titulo { font-size: 15px; letter-spacing: 2px; text-transform: uppercase; color: #8d7f72; margin-bottom: 12px; }

  .timer { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; padding: 8px 0; }
  .timer + .timer { border-top: 1px solid #2e2723; }
  .t-tempo { font-size: 42px; font-weight: 200; width: 130px; }
  .t-btns { -webkit-flex: 1; flex: 1; text-align: right; white-space: nowrap; }
  .btn { display: inline-block; background: #2e2723; color: #f3ece4; border-radius: 12px;
         font-size: 17px; padding: 12px 8px; margin-left: 5px; min-width: 42px; text-align: center; }
  .btn:active { background: #4a3f38; }
  .btn.play { background: #d9a46a; color: #14110f; font-weight: bold; }
  .timer.rodando .t-tempo { color: #d9a46a; }
  .timer.fim .t-tempo { color: #ff6b5a; }

  .lista-card { -webkit-flex: 1; flex: 1; display: -webkit-flex; display: flex;
                -webkit-flex-direction: column; flex-direction: column; margin-bottom: 0; }
  .add { display: -webkit-flex; display: flex; margin-bottom: 10px; }
  .add input { -webkit-flex: 1; flex: 1; font-size: 20px; padding: 10px 14px; border-radius: 12px;
               border: none; background: #2e2723; color: #f3ece4; -webkit-appearance: none; outline: none; }
  .add .btn { margin-left: 8px; }
  .itens { -webkit-flex: 1; flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .item { font-size: 21px; padding: 10px 4px; border-bottom: 1px solid #2e2723; }
  .item.feito { color: #5e554d; text-decoration: line-through; }
  .vazio { color: #5e554d; font-size: 17px; padding: 8px 4px; }
  .limpar { font-size: 15px; color: #8d7f72; text-align: right; padding-top: 10px; }


  .avisos-card { margin-top: 22px; margin-bottom: 0; padding: 14px 18px; }
  .aviso { padding: 9px 0; border-top: 1px solid #2e2723; display: -webkit-flex; display: flex; }
  .aviso:first-of-type { border-top: none; }
  .aviso .ponto { width: 10px; height: 10px; border-radius: 5px; background: #d9a46a; margin: 8px 12px 0 0; -webkit-flex-shrink: 0; flex-shrink: 0; }
  .aviso .at { font-size: 19px; line-height: 1.3; }
  .aviso .aq { font-size: 13px; color: #8d7f72; margin-top: 2px; }
  .avisos-dica { font-size: 12px; color: #5e554d; margin-top: 6px; }
  body.noite .card, body.noite .h { background: #0d0b0a; }
  body.noite .data { color: #7a5c3d; }

  #apagado { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #000; z-index: 9; }
  #alarme { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: #b8432f; color: #fff; text-align: center; z-index: 10; padding-top: 220px; }
  #alarme .a1 { font-size: 64px; font-weight: 300; }
  #alarme .a2 { font-size: 24px; margin-top: 20px; opacity: .85; }
</style>
</head>
<body>
<div class="wrap">
  <div class="col-esq">
    <div class="hora" id="hora">--:--</div>
    <div class="data" id="data"></div>

    <div class="clima">
      <div class="clima-agora">
        <div class="clima-icone" id="cIcone">·</div>
        <div>
          <div class="clima-temp" id="cTemp">--°</div>
        </div>
      </div>
      <div class="clima-desc" id="cDesc">Carregando o clima…</div>
      <div class="clima-extra" id="cExtra"></div>
      <div class="horas" id="horas"></div>
      <div class="atualizado" id="cAtual"></div>
    </div>

    <div class="card avisos-card" id="avisosCard" style="display:none">
      <div class="titulo">Avisos</div>
      <div id="avisos"></div>
      <div class="avisos-dica">Toque num aviso para marcar como visto</div>
    </div>
  </div>

  <div class="col-dir">
    <div class="card">
      <div class="titulo">Timers</div>
      <div id="timers"></div>
    </div>

    <div class="card lista-card">
      <div class="titulo">Lista de compras</div>
      <div class="add">
        <input id="novoItem" type="text" placeholder="Adicionar item…" autocomplete="off" autocorrect="on">
        <div class="btn play" id="btnAdd">+</div>
      </div>
      <div class="itens" id="itens"></div>
      <div class="limpar" id="btnLimpar">Remover itens riscados</div>
    </div>
  </div>
</div>

<div id="apagado"></div>
<div id="alarme"><div class="a1" id="alarmeTxt">Timer acabou!</div><div class="a2">Toque para parar</div></div>

<script>
/* ======== CONFIGURAÇÃO ======== */
var CONFIG = {
  cidade: "Belo Horizonte",
  latitude: -19.92,
  longitude: -43.94,
  noiteDe: 22,   // a partir desta hora a tela fica mais escura
  noiteAte: 6,   // até esta hora
  desligaDe: 1,  // tela totalmente preta a partir desta hora
  desligaAte: 7  // até esta hora (um toque acende por 1 minuto)
};

/* JavaScript em ES5 puro (sem let/const/arrow/fetch) para rodar no iOS 9 */
var DIAS = ["domingo","segunda-feira","terça-feira","quarta-feira","quinta-feira","sexta-feira","sábado"];
var MESES = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];

function $(id) { return document.getElementById(id); }
function dois(n) { return (n < 10 ? "0" : "") + n; }
function toque(el, fn) {
  // resposta rápida ao toque no Safari antigo (evita o atraso de 300ms do click)
  var mexeu = false;
  el.addEventListener("touchstart", function () { mexeu = false; }, false);
  el.addEventListener("touchmove", function () { mexeu = true; }, false);
  el.addEventListener("touchend", function (e) { if (!mexeu) { e.preventDefault(); fn(e); } }, false);
  el.addEventListener("click", fn, false);
}

/* ======== RELÓGIO ======== */
function relogio() {
  var d = new Date();
  $("hora").innerHTML = dois(d.getHours()) + ":" + dois(d.getMinutes()) + '<span class="seg">' + dois(d.getSeconds()) + "</span>";
  var dia = DIAS[d.getDay()];
  $("data").innerHTML = dia.charAt(0).toUpperCase() + dia.slice(1) + ", " + d.getDate() + " de " + MESES[d.getMonth()];
  var h = d.getHours();
  var noite = (h >= CONFIG.noiteDe || h < CONFIG.noiteAte);
  document.body.className = noite ? "noite" : "";
  var desligado = (h >= CONFIG.desligaDe && h < CONFIG.desligaAte);
  var algumRodando = false;
  for (var i = 0; i < timers.length; i++) if (timers[i].rodando || timers[i].fim) algumRodando = true;
  $("apagado").style.display = (desligado && !algumRodando && Date.now() > acordadoAte) ? "block" : "none";
}
var acordadoAte = 0;

/* ======== CLIMA (Open-Meteo, sem chave) ======== */
function climaInfo(cod) {
  if (cod === 0) return ["☀️", "Céu limpo"];
  if (cod === 1) return ["🌤", "Quase sem nuvens"];
  if (cod === 2) return ["⛅️", "Parcialmente nublado"];
  if (cod === 3) return ["☁️", "Nublado"];
  if (cod === 45 || cod === 48) return ["🌫", "Neblina"];
  if (cod >= 51 && cod <= 57) return ["🌦", "Garoa"];
  if (cod >= 61 && cod <= 67) return ["🌧", "Chuva"];
  if (cod >= 71 && cod <= 77) return ["❄️", "Neve"];
  if (cod >= 80 && cod <= 82) return ["🌧", "Pancadas de chuva"];
  if (cod >= 95) return ["⛈", "Trovoadas"];
  return ["·", ""];
}

function urlClima(protocolo) {
  return protocolo + "//api.open-meteo.com/v1/forecast?latitude=" + CONFIG.latitude +
    "&longitude=" + CONFIG.longitude +
    "&current=temperature_2m,apparent_temperature,weather_code" +
    "&hourly=temperature_2m,weather_code,precipitation_probability" +
    "&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max" +
    "&timezone=America%2FSao_Paulo&forecast_days=2";
}

function pedirClima(protocolo, tentouOutro) {
  var xhr = new XMLHttpRequest();
  xhr.open("GET", urlClima(protocolo), true);
  xhr.timeout = 15000;
  xhr.onreadystatechange = function () {
    if (xhr.readyState !== 4) return;
    if (xhr.status === 200) {
      try { mostrarClima(JSON.parse(xhr.responseText)); return; } catch (e) {}
    }
    falhou();
  };
  xhr.ontimeout = falhou;
  var jaFalhou = false;
  function falhou() {
    if (jaFalhou) return; jaFalhou = true;
    // iOS 9 às vezes recusa certificados novos: tenta o outro protocolo uma vez
    if (!tentouOutro && location.protocol !== "https:") {
      pedirClima(protocolo === "https:" ? "http:" : "https:", true);
    } else if ($("cTemp").innerHTML === "--°") {
      $("cDesc").innerHTML = "Clima indisponível agora";
    }
  }
  try { xhr.send(); } catch (e) { falhou(); }
}

function atualizarClima() {
  pedirClima(location.protocol === "http:" ? "http:" : "https:", false);
}

function mostrarClima(j) {
  var c = j.current, info = climaInfo(c.weather_code);
  $("cIcone").innerHTML = info[0];
  $("cTemp").innerHTML = Math.round(c.temperature_2m) + "°";
  $("cDesc").innerHTML = info[1] + " em " + CONFIG.cidade;
  var dd = j.daily;
  $("cExtra").innerHTML = "Máx " + Math.round(dd.temperature_2m_max[0]) + "° · Mín " +
    Math.round(dd.temperature_2m_min[0]) + "° · Sensação " + Math.round(c.apparent_temperature) + "°" +
    " · Chuva " + (dd.precipitation_probability_max[0] || 0) + "%";

  // próximas horas, de 3 em 3
  var agora = new Date(), html = "", achadas = 0, hr = j.hourly, i;
  for (i = 0; i < hr.time.length && achadas < 5; i++) {
    var p = hr.time[i].split("T"), dp = p[0].split("-"), hp = p[1].split(":");
    var t = new Date(+dp[0], +dp[1] - 1, +dp[2], +hp[0], 0, 0);
    if (t.getTime() <= agora.getTime()) continue;
    if (+hp[0] % 3 !== 0) continue;
    var ii = climaInfo(hr.weather_code[i]);
    var chuva = hr.precipitation_probability[i];
    html += '<div class="h"><div class="hh">' + dois(+hp[0]) + 'h</div><div class="hi">' + ii[0] +
      '</div><div class="ht">' + Math.round(hr.temperature_2m[i]) + '°</div><div class="hc">' +
      (chuva >= 20 ? chuva + "%" : "&nbsp;") + "</div></div>";
    achadas++;
  }
  $("horas").innerHTML = html;
  var d = new Date();
  $("cAtual").innerHTML = "Atualizado às " + dois(d.getHours()) + ":" + dois(d.getMinutes());
}

/* ======== SOM (precisa ser liberado por um toque no iOS) ======== */
var audioCtx = null, bipando = null;
function liberarSom() {
  if (audioCtx) return;
  var AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  audioCtx = new AC();
  var o = audioCtx.createOscillator(), g = audioCtx.createGain();
  g.gain.value = 0; o.connect(g); g.connect(audioCtx.destination);
  o.start ? o.start(0) : o.noteOn(0);
  o.stop ? o.stop(audioCtx.currentTime + 0.05) : o.noteOff(audioCtx.currentTime + 0.05);
}
function bip() {
  if (!audioCtx) return;
  var agora = audioCtx.currentTime, k;
  for (k = 0; k < 3; k++) {
    var o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.frequency.value = 880; g.gain.value = 0.5;
    o.connect(g); g.connect(audioCtx.destination);
    var ini = agora + k * 0.3;
    o.start ? o.start(ini) : o.noteOn(ini);
    o.stop ? o.stop(ini + 0.18) : o.noteOff(ini + 0.18);
  }
}
function tocarAlarme(nome) {
  $("alarmeTxt").innerHTML = nome + " acabou!";
  $("alarme").style.display = "block";
  bip();
  if (!bipando) bipando = setInterval(bip, 1500);
}
function pararAlarme() {
  $("alarme").style.display = "none";
  if (bipando) { clearInterval(bipando); bipando = null; }
  for (var i = 0; i < timers.length; i++) {
    if (timers[i].fim) { timers[i].fim = false; timers[i].resta = 0; desenharTimer(timers[i]); }
  }
}

/* ======== TIMERS ======== */
var timers = [];
function criarTimer(nome) {
  var t = { nome: nome, resta: 0, rodando: false, alvo: 0, fim: false };
  var el = document.createElement("div");
  el.className = "timer";
  el.innerHTML = '<div class="t-tempo">00:00</div><div class="t-btns">' +
    '<div class="btn" data-a="1">+1</div><div class="btn" data-a="5">+5</div>' +
    '<div class="btn" data-a="10">+10</div><div class="btn play" data-a="play">▶︎</div>' +
    '<div class="btn" data-a="zero">✕</div></div>';
  t.el = el;
  var btns = el.getElementsByClassName("btn"), i;
  for (i = 0; i < btns.length; i++) {
    (function (b) {
      toque(b, function () { liberarSom(); acaoTimer(t, b.getAttribute("data-a")); });
    })(btns[i]);
  }
  $("timers").appendChild(el);
  timers.push(t);
  desenharTimer(t);
}
function acaoTimer(t, a) {
  if (a === "play") {
    if (t.rodando) { t.resta = Math.max(0, t.alvo - Date.now()); t.rodando = false; }
    else if (t.resta > 0) { t.alvo = Date.now() + t.resta; t.rodando = true; }
  } else if (a === "zero") {
    t.rodando = false; t.resta = 0; t.fim = false;
  } else {
    var mais = parseInt(a, 10) * 60000;
    if (t.rodando) t.alvo += mais; else t.resta += mais;
  }
  desenharTimer(t);
}
function desenharTimer(t) {
  var ms = t.rodando ? Math.max(0, t.alvo - Date.now()) : t.resta;
  var s = Math.ceil(ms / 1000), m = Math.floor(s / 60);
  var txt = m >= 60 ? Math.floor(m / 60) + ":" + dois(m % 60) + ":" + dois(s % 60) : dois(m) + ":" + dois(s % 60);
  t.el.children[0].innerHTML = txt;
  t.el.className = "timer" + (t.rodando ? " rodando" : "") + (t.fim ? " fim" : "");
  t.el.getElementsByClassName("play")[0].innerHTML = t.rodando ? "❚❚" : "▶︎";
}
function tickTimers() {
  for (var i = 0; i < timers.length; i++) {
    var t = timers[i];
    if (t.rodando && Date.now() >= t.alvo) {
      t.rodando = false; t.resta = 0; t.fim = true;
      tocarAlarme(t.nome);
    }
    desenharTimer(t);
  }
}

/* ======== LISTA DE COMPRAS (fica salva no próprio iPad) ======== */
var lista = [];
function carregarLista() {
  try { lista = JSON.parse(localStorage.getItem("listaCompras") || "[]"); } catch (e) { lista = []; }
}
function salvarLista() {
  try { localStorage.setItem("listaCompras", JSON.stringify(lista)); } catch (e) {}
}
function desenharLista() {
  var box = $("itens"), i;
  box.innerHTML = "";
  if (!lista.length) { box.innerHTML = '<div class="vazio">Nada na lista por enquanto.</div>'; return; }
  for (i = 0; i < lista.length; i++) {
    (function (idx) {
      var d = document.createElement("div");
      d.className = "item" + (lista[idx].feito ? " feito" : "");
      d.appendChild(document.createTextNode(lista[idx].txt));
      toque(d, function () { lista[idx].feito = !lista[idx].feito; salvarLista(); desenharLista(); });
      box.appendChild(d);
    })(i);
  }
}
function adicionarItem() {
  var inp = $("novoItem"), v = inp.value.replace(/^\s+|\s+$/g, "");
  if (!v) return;
  lista.push({ txt: v, feito: false });
  inp.value = ""; salvarLista(); desenharLista();
}


/* ======== AVISOS (arquivo avisos.json no mesmo site, atualizado pelo Claude) ======== */
var vistos = {};
try { vistos = JSON.parse(localStorage.getItem("avisosVistos") || "{}"); } catch (e) { vistos = {}; }
var ultimosAvisos = [];
function quandoTxt(iso) {
  if (!iso) return "";
  var p = iso.split("T"), dp = p[0].split("-"), hp = (p[1] || "00:00").split(":");
  var d = new Date(+dp[0], +dp[1] - 1, +dp[2], +hp[0], +hp[1]);
  var hoje = new Date(), ontem = new Date(); ontem.setDate(hoje.getDate() - 1);
  var dia = d.toDateString() === hoje.toDateString() ? "hoje" :
            d.toDateString() === ontem.toDateString() ? "ontem" : d.getDate() + "/" + dois(d.getMonth() + 1);
  return dia + " às " + dois(d.getHours()) + ":" + dois(d.getMinutes());
}
function desenharAvisos() {
  var box = $("avisos"), html = [], n = 0, i;
  box.innerHTML = "";
  var lista2 = ultimosAvisos.slice().sort(function (a, b) { return (b.quando || "") > (a.quando || "") ? 1 : -1; });
  for (i = 0; i < lista2.length && n < 3; i++) {
    var a = lista2[i];
    if (!a || !a.id || vistos[a.id]) continue;
    (function (av) {
      var d = document.createElement("div");
      d.className = "aviso";
      d.innerHTML = '<div class="ponto"></div><div><div class="at"></div><div class="aq"></div></div>';
      d.getElementsByClassName("at")[0].appendChild(document.createTextNode(av.texto || ""));
      d.getElementsByClassName("aq")[0].appendChild(document.createTextNode(quandoTxt(av.quando)));
      toque(d, function () {
        vistos[av.id] = 1;
        try { localStorage.setItem("avisosVistos", JSON.stringify(vistos)); } catch (e) {}
        desenharAvisos();
      });
      box.appendChild(d);
    })(a);
    n++;
  }
  $("avisosCard").style.display = n ? "block" : "none";
}
function atualizarAvisos() {
  var xhr = new XMLHttpRequest();
  xhr.open("GET", "avisos.json?t=" + Date.now(), true);
  xhr.onreadystatechange = function () {
    if (xhr.readyState !== 4 || xhr.status !== 200) return;
    try { ultimosAvisos = JSON.parse(xhr.responseText).avisos || []; desenharAvisos(); } catch (e) {}
  };
  try { xhr.send(); } catch (e) {}
}

/* ======== INÍCIO ======== */
toque($("btnAdd"), adicionarItem);
$("novoItem").addEventListener("keyup", function (e) { if (e.keyCode === 13) { adicionarItem(); this.blur(); } }, false);
toque($("btnLimpar"), function () {
  var nova = [];
  for (var i = 0; i < lista.length; i++) if (!lista[i].feito) nova.push(lista[i]);
  lista = nova; salvarLista(); desenharLista();
});
toque($("alarme"), pararAlarme);
toque($("apagado"), function () { acordadoAte = Date.now() + 60000; relogio(); });
document.addEventListener("touchstart", liberarSom, false);

criarTimer("Timer 1");
criarTimer("Timer 2");
carregarLista(); desenharLista();
relogio(); setInterval(relogio, 1000);
setInterval(tickTimers, 250);
atualizarClima(); setInterval(atualizarClima, 15 * 60 * 1000);
atualizarAvisos(); setInterval(atualizarAvisos, 5 * 60 * 1000);

// recarrega a página de madrugada para o iPad antigo não acumular memória
setInterval(function () {
  var d = new Date();
  var algumRodando = false;
  for (var i = 0; i < timers.length; i++) if (timers[i].rodando) algumRodando = true;
  if (d.getHours() === 4 && d.getMinutes() === 0 && !algumRodando) location.reload();
}, 60000);
</script>
