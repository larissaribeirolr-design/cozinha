<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cozinha">

<title>Painel da Cozinha</title>
<style>
  /* Feito para o Safari do iOS 9 (iPad 2): flexbox com prefixo, animações -webkit- */
  * { box-sizing: border-box; -webkit-box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #15110f; color: #f5eee6;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-user-select: none; -webkit-tap-highlight-color: rgba(0,0,0,0);
    overflow: hidden;
  }
  .wrap { display: -webkit-flex; display: flex; height: 100%; padding: 26px 26px 22px; }
  .col { display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; }
  .col-esq { -webkit-flex: 1.15; flex: 1.15; padding-right: 24px; overflow: hidden; }
  .col-dir { -webkit-flex: 1; flex: 1; }

  /* relógio */
  .hora { font-size: 124px; font-weight: 200; letter-spacing: -3px; line-height: 1; }
  .hora .seg { font-size: 38px; color: #8d7f72; letter-spacing: 0; margin-left: 6px; }
  .data { font-size: 26px; font-weight: 300; margin-top: 6px; color: #e3a96b; }
  .oi { font-size: 19px; color: #b9aea3; margin-top: 6px; }

  /* clima */
  .clima { margin-top: 20px; }
  .clima-agora { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; }
  .clima-icone { font-size: 58px; margin-right: 14px; display: inline-block; -webkit-animation: flutua 4s ease-in-out infinite; }
  .clima-temp { font-size: 64px; font-weight: 200; margin-right: 16px; }
  .clima-desc { font-size: 19px; color: #d8cec4; }
  .clima-extra { font-size: 15px; color: #8d7f72; margin-top: 3px; }
  .clima-dica { font-size: 16px; color: #e3a96b; margin-top: 3px; }
  .horas { display: -webkit-flex; display: flex; margin-top: 12px; }
  .h { -webkit-flex: 1; flex: 1; text-align: center; padding: 7px 0; border-radius: 14px; background: #211b18; margin-right: 7px; }
  .h:last-child { margin-right: 0; }
  .h .hh { font-size: 13px; color: #8d7f72; }
  .h .hi { font-size: 21px; margin: 2px 0; }
  .h .ht { font-size: 17px; }
  .h .hc { font-size: 12px; color: #74aee0; }

  /* cards */
  .card { background: #211b18; border-radius: 20px; padding: 14px 18px; margin-bottom: 14px; }
  .titulo { font-size: 13px; letter-spacing: 2px; text-transform: uppercase; color: #8d7f72; margin-bottom: 8px; }

  /* gracinha do dia */
  .alegria { margin-top: 16px; display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center;
             border: 2px solid #3a2f29; }
  .mascote { font-size: 58px; margin-right: 14px; display: inline-block; -webkit-animation: pula 2.6s ease-in-out infinite; }
  .frase { font-size: 19px; line-height: 1.35; }
  .frase-sub { font-size: 13px; color: #8d7f72; margin-top: 4px; }
  .niver { background: #3a2230; border-color: #b45b8c; }
  .niver .mascote { -webkit-animation: festa 1.2s ease-in-out infinite; }

  /* avisos */
  .aviso { padding: 7px 0; border-top: 1px solid #2f2723; display: -webkit-flex; display: flex; }
  .aviso:first-child { border-top: none; }
  .aviso .ponto { width: 9px; height: 9px; border-radius: 5px; background: #e3a96b; margin: 7px 10px 0 0;
                  -webkit-flex-shrink: 0; flex-shrink: 0; -webkit-animation: pisca 2s ease-in-out infinite; }
  .aviso .at { font-size: 17px; line-height: 1.3; }
  .aviso .aq { font-size: 12px; color: #8d7f72; margin-top: 1px; }

  /* timer */
  .timer { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; }
  .t-icone { font-size: 30px; margin-right: 10px; }
  .t-tempo { font-size: 40px; font-weight: 200; -webkit-flex: 1; flex: 1; }
  .btn { display: inline-block; background: #2f2723; color: #f5eee6; border-radius: 12px;
         font-size: 17px; padding: 11px 8px; margin-left: 5px; min-width: 42px; text-align: center; }
  .btn:active { background: #4a3f38; }
  .btn.play { background: #e3a96b; color: #15110f; font-weight: bold; }
  .timer.rodando .t-tempo { color: #e3a96b; }
  .timer.rodando .t-icone { -webkit-animation: balanca 1s ease-in-out infinite; }

  /* k-pop */
  .kpop-topo { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; margin-bottom: 8px; }
  .kpop-topo .titulo { margin-bottom: 0; -webkit-flex: 1; flex: 1; }
  .coracao { font-size: 18px; display: inline-block; -webkit-animation: bate 1.4s ease-in-out infinite; }
  .ev { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; padding: 5px 0; }
  .ev-quando { font-size: 13px; font-weight: bold; color: #15110f; background: #e3a96b; border-radius: 9px;
               padding: 3px 8px; margin-right: 10px; min-width: 74px; text-align: center; -webkit-flex-shrink: 0; flex-shrink: 0; }
  .ev-quando.hoje { background: #ff7aa8; -webkit-animation: pisca 1.5s ease-in-out infinite; }
  .ev-txt { font-size: 16px; line-height: 1.25; }
  .sep { height: 1px; background: #2f2723; margin: 8px 0 6px; }
  .nt { padding: 5px 0; font-size: 16px; line-height: 1.3; }
  .tag { display: inline-block; font-size: 11px; font-weight: bold; letter-spacing: 1px; border-radius: 6px;
         padding: 2px 6px; margin-right: 6px; color: #15110f; vertical-align: 2px; }
  .tag-ateez { background: #f08a4b; } .tag-skz { background: #ef5a5f; } .tag-bts { background: #a982e6; }
  .kpop-atual { font-size: 11px; color: #5e554d; margin-top: 6px; text-align: right; }

  /* lista */
  .lista-card { -webkit-flex: 1; flex: 1; display: -webkit-flex; display: flex;
                -webkit-flex-direction: column; flex-direction: column; margin-bottom: 0; min-height: 150px; }
  .add { display: -webkit-flex; display: flex; margin-bottom: 6px; }
  .add input { -webkit-flex: 1; flex: 1; font-size: 18px; padding: 9px 12px; border-radius: 12px;
               border: none; background: #2f2723; color: #f5eee6; -webkit-appearance: none; outline: none; }
  .add .btn { margin-left: 8px; }
  .itens { -webkit-flex: 1; flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .item { font-size: 19px; padding: 8px 4px; border-bottom: 1px solid #2f2723; }
  .item.feito { color: #5e554d; text-decoration: line-through; }
  .vazio { color: #5e554d; font-size: 16px; padding: 6px 4px; }
  .limpar { font-size: 13px; color: #8d7f72; text-align: right; padding-top: 6px; }

  /* noite */
  body.noite { background: #000; color: #8a7f74; }
  body.noite .card, body.noite .h { background: #0d0b0a; border-color: #1c1714; }
  body.noite .data, body.noite .clima-dica { color: #7a5c3d; }
  body.noite .mascote, body.noite .clima-icone { -webkit-animation: none; }

  /* telas cheias */
  #apagado { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #000; z-index: 9; }
  #alarme { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: #c4503a; color: #fff; text-align: center; z-index: 10; padding-top: 200px; }
  #alarme .a0 { font-size: 90px; display: inline-block; -webkit-animation: balanca .5s ease-in-out infinite; }
  #alarme .a1 { font-size: 60px; font-weight: 300; margin-top: 10px; }
  #alarme .a2 { font-size: 22px; margin-top: 16px; opacity: .85; }

  /* confete dos aniversários */
  .confete { position: fixed; top: -30px; font-size: 22px; z-index: 5; pointer-events: none;
             -webkit-animation: cai 9s linear infinite; }

  @-webkit-keyframes flutua { 0%,100% { -webkit-transform: translateY(0); } 50% { -webkit-transform: translateY(-6px); } }
  @-webkit-keyframes pula { 0%,100% { -webkit-transform: translateY(0) rotate(0); } 20% { -webkit-transform: translateY(-12px) rotate(-6deg); }
                            40% { -webkit-transform: translateY(0) rotate(0); } 55% { -webkit-transform: translateY(-5px) rotate(4deg); } 70% { -webkit-transform: translateY(0); } }
  @-webkit-keyframes festa { 0%,100% { -webkit-transform: scale(1) rotate(-8deg); } 50% { -webkit-transform: scale(1.15) rotate(8deg); } }
  @-webkit-keyframes bate { 0%,100% { -webkit-transform: scale(1); } 15% { -webkit-transform: scale(1.25); } 30% { -webkit-transform: scale(1); } 45% { -webkit-transform: scale(1.18); } }
  @-webkit-keyframes balanca { 0%,100% { -webkit-transform: rotate(-12deg); } 50% { -webkit-transform: rotate(12deg); } }
  @-webkit-keyframes pisca { 0%,100% { opacity: 1; } 50% { opacity: .45; } }
  @-webkit-keyframes cai { 0% { -webkit-transform: translateY(0) rotate(0); } 100% { -webkit-transform: translateY(820px) rotate(360deg); } }
</style>
</head>
<body>
<div class="wrap">
  <div class="col col-esq">
    <div class="hora" id="hora">--:--</div>
    <div class="data" id="data"></div>
    <div class="oi" id="oi"></div>

    <div class="clima">
      <div class="clima-agora">
        <div class="clima-icone" id="cIcone">⛅️</div>
        <div class="clima-temp" id="cTemp">--°</div>
        <div>
          <div class="clima-desc" id="cDesc">Carregando o clima…</div>
          <div class="clima-extra" id="cExtra"></div>
          <div class="clima-dica" id="cDica"></div>
        </div>
      </div>
      <div class="horas" id="horas"></div>
    </div>

    <div class="card alegria" id="alegria">
      <div class="mascote" id="mascote">🐸</div>
      <div>
        <div class="frase" id="frase"></div>
        <div class="frase-sub" id="fraseSub"></div>
      </div>
    </div>

    <div class="card" id="avisosCard" style="display:none">
      <div class="titulo">Avisos</div>
      <div id="avisos"></div>
    </div>
  </div>

  <div class="col col-dir">
    <div class="card">
      <div class="timer" id="timer">
        <div class="t-icone">⏲</div>
        <div class="t-tempo" id="tTempo">00:00</div>
        <div class="btn" data-a="1">+1</div><div class="btn" data-a="5">+5</div><div class="btn" data-a="10">+10</div>
        <div class="btn play" id="tPlay" data-a="play">▶︎</div><div class="btn" data-a="zero">✕</div>
      </div>
    </div>

    <div class="card">
      <div class="kpop-topo"><div class="titulo">K-pop</div><div class="coracao">💜</div></div>
      <div id="eventos"></div>
      <div class="sep" id="kSep"></div>
      <div id="noticias"></div>
      <div class="kpop-atual" id="kAtual"></div>
    </div>

    <div class="card lista-card">
      <div class="titulo">Lista de compras</div>
      <div class="add">
        <input id="novoItem" type="text" placeholder="Adicionar item…" autocomplete="off" autocorrect="on">
        <div class="btn play" id="btnAdd">+</div>
      </div>
      <div class="itens" id="itens"></div>
      <div class="limpar" id="btnLimpar">Remover itens riscados</div>
    </div>
  </div>
</div>

<div id="confetes"></div>
<div id="apagado"></div>
<div id="alarme"><div class="a0">⏰</div><div class="a1">O timer acabou!</div><div class="a2">Toque para parar</div></div>

<script>
/* ======== CONFIGURAÇÃO ======== */
var CONFIG = {
  nome: "Lari",
  cidade: "Belo Horizonte",
  latitude: -19.92,
  longitude: -43.94,
  noiteDe: 22, noiteAte: 6,     // tela mais escura
  desligaDe: 1, desligaAte: 7   // tela preta (um toque acende por 1 minuto)
};

/* Aniversários fixos (mês-dia) */
var ANIVERSARIOS = [
  ["02-18","J-Hope","bts"],["03-09","Suga","bts"],["09-01","Jungkook","bts"],["09-12","RM","bts"],
  ["10-13","Jimin","bts"],["12-04","Jin","bts"],["12-30","V","bts"],
  ["10-03","Bang Chan","skz"],["10-25","Lee Know","skz"],["08-11","Changbin","skz"],["03-20","Hyunjin","skz"],
  ["09-14","Han","skz"],["09-15","Felix","skz"],["09-22","Seungmin","skz"],["02-08","I.N","skz"],
  ["11-07","Hongjoong","ateez"],["04-03","Seonghwa","ateez"],["03-23","Yunho","ateez"],["06-15","Yeosang","ateez"],
  ["07-10","San","ateez"],["08-09","Mingi","ateez"],["11-26","Wooyoung","ateez"],["10-12","Jongho","ateez"]
];
var DEBUTS = [["06-13","BTS","bts",2013],["03-25","Stray Kids","skz",2018],["10-24","ATEEZ","ateez",2018]];
var GRUPOS = { bts: "BTS", skz: "SKZ", ateez: "ATEEZ" };

/* Frases reserva (o Claude manda uma nova todo dia; estas entram se faltar) */
var FRASES = [
  "Hoje é um ótimo dia pra ser a protagonista. 🌟",
  "Água, comidinha boa e um K-pop no talo. Receita de felicidade. 🎶",
  "Você não está atrasada, está no seu tempo. 🐢",
  "Se a vida der limão, faz uma limonada e coloca um comeback pra tocar. 🍋",
  "Lembrete oficial: você é incrível. Assinado: a cozinha. 💛",
  "Pequenos passos ainda são passos. 👣",
  "O café não resolve tudo, mas ajuda bastante. ☕️",
  "Respira fundo. Você dá conta. 🌈",
  "Hoje vale dançar enquanto a água ferve. 💃",
  "Bom humor é o melhor tempero. 🍅",
  "Pausa pro lanchinho é autocuidado, sim. 🍪",
  "Você + uma playlist boa = imbatível. 🎧",
  "Já agradeceu a si mesma hoje? Tá esperando o quê? 🌻",
  "Plot twist: o dia vai ser bom. 🎬",
  "Nem toda receita sai perfeita, e tudo bem. 🍳",
  "Hidrata, alonga e segue brilhando. ✨",
  "O universo tá torcendo por você (e a gente também). 🌙",
  "Coragem! Até o pão de queijo precisa do forno pra crescer. 🧀",
  "Hoje é dia de fazer algo só porque você gosta. 🎨",
  "Sorriso no rosto e lista de compras em dia. 🛒",
  "Sabe aquela coisa difícil? Você já passou por piores. 💪",
  "Se ninguém te disse hoje: você tá mandando bem. 👏",
  "Devagar também é velocidade. 🐌",
  "Desliga o modo crítica e liga o modo carinho. 💗",
  "A melhor hora pra recomeçar é agora. 🌅",
  "Um dia de cada vez, uma música de cada vez. 🎵",
  "Dica do dia: menos pressa, mais presença. 🍃",
  "Você merece o mesmo cuidado que dá pros outros. ☕️",
  "Seja a energia de um fancam em 4K. 📸",
  "Hoje tem tudo pra ser leve. 🎈"
];
var MASCOTES = ["🐸","🐧","🐱","🐶","🐰","🐼","🐹","🐨","🐢","🐙","🐳","🐝","🐞","🐥","🦄","🐷","🐻","🐯","🐵","🐬"];

/* JavaScript ES5 puro (sem let/const/arrow/fetch) para rodar no iOS 9 */
var DIAS = ["domingo","segunda-feira","terça-feira","quarta-feira","quinta-feira","sexta-feira","sábado"];
var MESES = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];

function $(id) { return document.getElementById(id); }
function dois(n) { return (n < 10 ? "0" : "") + n; }
function esc(t) { return String(t == null ? "" : t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function hojeISO(d) { d = d || new Date(); return d.getFullYear() + "-" + dois(d.getMonth() + 1) + "-" + dois(d.getDate()); }
function diaDoAno(d) { var ini = new Date(d.getFullYear(), 0, 1); return Math.floor((d - ini) / 86400000); }
function dataDe(iso) { var p = iso.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
function toque(el, fn) {
  var mexeu = false;
  el.addEventListener("touchstart", function () { mexeu = false; }, false);
  el.addEventListener("touchmove", function () { mexeu = true; }, false);
  el.addEventListener("touchend", function (e) { if (!mexeu) { e.preventDefault(); fn(e); } }, false);
  el.addEventListener("click", fn, false);
}
function pegarJSON(url, ok, erro) {
  var xhr = new XMLHttpRequest();
  xhr.open("GET", url + (url.indexOf("?") < 0 ? "?" : "&") + "t=" + Date.now(), true);
  xhr.timeout = 15000;
  var feito = false;
  function falha() { if (!feito) { feito = true; if (erro) erro(); } }
  xhr.onreadystatechange = function () {
    if (xhr.readyState !== 4) return;
    if (xhr.status === 200) { try { var j = JSON.parse(xhr.responseText); feito = true; ok(j); return; } catch (e) {} }
    falha();
  };
  xhr.ontimeout = falha;
  try { xhr.send(); } catch (e) { falha(); }
}

/* ======== RELÓGIO ======== */
var acordadoAte = 0, ultimoDia = "";
function relogio() {
  var d = new Date(), h = d.getHours();
  $("hora").innerHTML = dois(h) + ":" + dois(d.getMinutes()) + '<span class="seg">' + dois(d.getSeconds()) + "</span>";
  var dia = DIAS[d.getDay()];
  $("data").innerHTML = dia.charAt(0).toUpperCase() + dia.slice(1) + ", " + d.getDate() + " de " + MESES[d.getMonth()];
  var oi = h < 5 ? "Boa madrugada" : h < 12 ? "Bom dia" : h < 18 ? "Boa tarde" : "Boa noite";
  var emo = h < 5 ? "🌙" : h < 12 ? "☀️" : h < 18 ? "🌤" : "🌙";
  $("oi").innerHTML = oi + ", " + CONFIG.nome + "! " + emo;

  document.body.className = (h >= CONFIG.noiteDe || h < CONFIG.noiteAte) ? "noite" : "";
  var desligado = (h >= CONFIG.desligaDe && h < CONFIG.desligaAte);
  $("apagado").style.display = (desligado && !timer.rodando && !timer.fim && Date.now() > acordadoAte) ? "block" : "none";

  if (hojeISO(d) !== ultimoDia) { ultimoDia = hojeISO(d); desenharAlegria(); desenharKpop(); }
}

/* ======== CLIMA ======== */
function climaInfo(cod) {
  if (cod === 0) return ["☀️", "Céu limpo"];
  if (cod === 1) return ["🌤", "Quase sem nuvens"];
  if (cod === 2) return ["⛅️", "Parcialmente nublado"];
  if (cod === 3) return ["☁️", "Nublado"];
  if (cod === 45 || cod === 48) return ["🌫", "Neblina"];
  if (cod >= 51 && cod <= 57) return ["🌦", "Garoa"];
  if (cod >= 61 && cod <= 67) return ["🌧", "Chuva"];
  if (cod >= 71 && cod <= 77) return ["❄️", "Neve"];
  if (cod >= 80 && cod <= 82) return ["🌧", "Pancadas de chuva"];
  if (cod >= 95) return ["⛈", "Trovoadas"];
  return ["🌡", ""];
}
function urlOpenMeteo() {
  return "https://api.open-meteo.com/v1/forecast?latitude=" + CONFIG.latitude + "&longitude=" + CONFIG.longitude +
    "&current=temperature_2m,apparent_temperature,weather_code" +
    "&hourly=temperature_2m,weather_code,precipitation_probability" +
    "&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max" +
    "&timezone=America%2FSao_Paulo&forecast_days=2";
}
function atualizarClima() {
  // 1º: arquivo no próprio site (atualizado de hora em hora pelo GitHub). 2º: direto na Open-Meteo.
  pegarJSON("clima.json", mostrarClima, function () {
    pegarJSON(urlOpenMeteo(), mostrarClima, function () {
      if ($("cTemp").innerHTML === "--°") $("cDesc").innerHTML = "Clima indisponível agora";
    });
  });
}
function mostrarClima(j) {
  var c = j.current, info = climaInfo(c.weather_code), dd = j.daily;
  $("cIcone").innerHTML = info[0];
  $("cTemp").innerHTML = Math.round(c.temperature_2m) + "°";
  $("cDesc").innerHTML = info[1];
  var max = Math.round(dd.temperature_2m_max[0]), min = Math.round(dd.temperature_2m_min[0]);
  var chuva = dd.precipitation_probability_max[0] || 0;
  $("cExtra").innerHTML = "Máx " + max + "° · Mín " + min + "° · Chuva " + chuva + "%";
  var dica = chuva >= 60 ? "Leva o guarda-chuva! ☔️" : chuva >= 35 ? "Pode pingar, fica de olho. 🌂" :
             max >= 31 ? "Calorão! Dia de picolé. 🍦" : min <= 13 ? "Friozinho: casaquinho e chá. ☕️" :
             info[0] === "☀️" ? "Sol lindo lá fora! 😎" : "";
  $("cDica").innerHTML = dica;

  var agora = new Date(), html = "", n = 0, hr = j.hourly, i;
  for (i = 0; i < hr.time.length && n < 5; i++) {
    var p = hr.time[i].split("T"), dp = p[0].split("-"), hp = +p[1].split(":")[0];
    var t = new Date(+dp[0], +dp[1] - 1, +dp[2], hp, 0, 0);
    if (t.getTime() <= agora.getTime() || hp % 3 !== 0) continue;
    var ii = climaInfo(hr.weather_code[i]), pc = hr.precipitation_probability[i];
    html += '<div class="h"><div class="hh">' + dois(hp) + 'h</div><div class="hi">' + ii[0] + '</div><div class="ht">' +
      Math.round(hr.temperature_2m[i]) + '°</div><div class="hc">' + (pc >= 20 ? pc + "%" : "&nbsp;") + "</div></div>";
    n++;
  }
  $("horas").innerHTML = html;
}

/* ======== DADOS DO DIA (dia.json, atualizado pelo Claude toda manhã) ======== */
var DIA = null;
function atualizarDia() { pegarJSON("dia.json", function (j) { DIA = j; desenharAlegria(); desenharKpop(); }); }

/* ======== GRACINHA DO DIA ======== */
function aniversariantesHoje() {
  var d = new Date(), md = dois(d.getMonth() + 1) + "-" + dois(d.getDate()), r = [], i;
  for (i = 0; i < ANIVERSARIOS.length; i++) if (ANIVERSARIOS[i][0] === md) r.push(ANIVERSARIOS[i][1] + " (" + GRUPOS[ANIVERSARIOS[i][2]] + ")");
  for (i = 0; i < DEBUTS.length; i++) if (DEBUTS[i][0] === md) r.push((d.getFullYear() - DEBUTS[i][3]) + " anos de debut do " + DEBUTS[i][1]);
  return r;
}
function desenharAlegria() {
  var d = new Date(), n = diaDoAno(d);
  var frase = FRASES[n % FRASES.length], mascote = MASCOTES[n % MASCOTES.length];
  if (DIA && DIA.data === hojeISO(d)) {
    if (DIA.frase) frase = DIA.frase;
    if (DIA.mascote) mascote = DIA.mascote;
  }
  var niver = aniversariantesHoje(), card = $("alegria");
  if (niver.length) {
    $("mascote").innerHTML = "🎂";
    $("frase").innerHTML = "Hoje é dia de festa: " + esc(niver.join(" e ")) + "! 🎉";
    $("fraseSub").innerHTML = esc(frase);
    card.className = "card alegria niver";
    soltarConfete(true);
  } else {
    $("mascote").innerHTML = mascote;
    $("frase").innerHTML = esc(frase);
    $("fraseSub").innerHTML = "Frase do dia";
    card.className = "card alegria";
    soltarConfete(false);
  }
}
function soltarConfete(sim) {
  var box = $("confetes"), i, pecas = ["🎉","✨","💜","🎈","⭐️","🎊"];
  box.innerHTML = "";
  if (!sim) return;
  for (i = 0; i < 10; i++) {
    var c = document.createElement("div");
    c.className = "confete";
    c.innerHTML = pecas[i % pecas.length];
    c.style.left = (5 + i * 9.5) + "%";
    c.style.webkitAnimationDelay = (i * 0.9) + "s";
    c.style.webkitAnimationDuration = (8 + (i % 4)) + "s";
    box.appendChild(c);
  }
}

/* ======== K-POP ======== */
function quandoFalta(dias) { return dias === 0 ? "hoje!" : dias === 1 ? "amanhã" : "em " + dias + " dias"; }
function desenharKpop() {
  var hoje = dataDe(hojeISO()), lista = [], i, ano = hoje.getFullYear();
  // aniversários e debuts nos próximos 21 dias
  function addFixo(md, txt, tipo) {
    var dt = dataDe(ano + "-" + md);
    if (dt < hoje) dt = dataDe((ano + 1) + "-" + md);
    var dias = Math.round((dt - hoje) / 86400000);
    if (dias <= 21) lista.push({ dias: dias, txt: txt, tipo: tipo });
  }
  for (i = 0; i < ANIVERSARIOS.length; i++) addFixo(ANIVERSARIOS[i][0], "Aniversário do " + ANIVERSARIOS[i][1] + " 🎂", ANIVERSARIOS[i][2]);
  for (i = 0; i < DEBUTS.length; i++) addFixo(DEBUTS[i][0], "Aniversário de debut do " + DEBUTS[i][1] + " 🎉", DEBUTS[i][2]);
  // eventos enviados pelo Claude (comebacks, shows, lançamentos)
  var evs = (DIA && DIA.eventos) || [];
  for (i = 0; i < evs.length; i++) {
    if (!evs[i].data) continue;
    var dias = Math.round((dataDe(evs[i].data) - hoje) / 86400000);
    if (dias >= 0) lista.push({ dias: dias, txt: evs[i].texto, tipo: evs[i].grupo });
  }
  lista.sort(function (a, b) { return a.dias - b.dias; });
  var html = "";
  for (i = 0; i < lista.length && i < 3; i++) {
    var e = lista[i];
    html += '<div class="ev"><div class="ev-quando' + (e.dias === 0 ? " hoje" : "") + '">' + quandoFalta(e.dias) + '</div>' +
      '<div class="ev-txt">' + (GRUPOS[e.tipo] ? '<span class="tag tag-' + e.tipo + '">' + GRUPOS[e.tipo] + "</span>" : "") + esc(e.txt) + "</div></div>";
  }
  $("eventos").innerHTML = html;

  var nts = (DIA && DIA.noticias) || [];
  if (nts.length) {
    html = "";
    for (i = 0; i < nts.length && i < 3; i++) {
      var g = nts[i].grupo;
      html += '<div class="nt">' + (GRUPOS[g] ? '<span class="tag tag-' + g + '">' + GRUPOS[g] + "</span>" : "") + esc(nts[i].texto) + "</div>";
    }
    $("noticias").innerHTML = html;
  } else {
    $("noticias").innerHTML = "";
    if (!lista.length) $("eventos").innerHTML = '<div class="vazio">Nenhum aniversário nas próximas semanas.</div>';
  }
  $("kSep").style.display = (lista.length && nts.length) ? "block" : "none";
  if (DIA && DIA.data && nts.length) {
    var dd = DIA.data.split("-");
    $("kAtual").innerHTML = "Notícias de " + dd[2] + "/" + dd[1];
  }
}

/* ======== AVISOS (avisos.json) ======== */
var vistos = {};
try { vistos = JSON.parse(localStorage.getItem("avisosVistos") || "{}"); } catch (e) { vistos = {}; }
var ultimosAvisos = [];
function quandoTxt(iso) {
  if (!iso) return "";
  var p = iso.split("T"), dp = p[0].split("-"), hp = (p[1] || "00:00").split(":");
  var d = new Date(+dp[0], +dp[1] - 1, +dp[2], +hp[0], +hp[1]);
  var hoje = new Date(), ontem = new Date(); ontem.setDate(hoje.getDate() - 1);
  var dia = d.toDateString() === hoje.toDateString() ? "hoje" :
            d.toDateString() === ontem.toDateString() ? "ontem" : d.getDate() + "/" + dois(d.getMonth() + 1);
  return dia + " às " + dois(d.getHours()) + ":" + dois(d.getMinutes());
}
function desenharAvisos() {
  var box = $("avisos"), n = 0, i;
  box.innerHTML = "";
  var l = ultimosAvisos.slice().sort(function (a, b) { return (b.quando || "") > (a.quando || "") ? 1 : -1; });
  for (i = 0; i < l.length && n < 2; i++) {
    var a = l[i];
    if (!a || !a.id || vistos[a.id]) continue;
    (function (av) {
      var d = document.createElement("div");
      d.className = "aviso";
      d.innerHTML = '<div class="ponto"></div><div><div class="at">' + esc(av.texto) + '</div><div class="aq">' +
        esc(quandoTxt(av.quando)) + " · toque para marcar como visto</div></div>";
      toque(d, function () {
        vistos[av.id] = 1;
        try { localStorage.setItem("avisosVistos", JSON.stringify(vistos)); } catch (e) {}
        desenharAvisos();
      });
      box.appendChild(d);
    })(a);
    n++;
  }
  $("avisosCard").style.display = n ? "block" : "none";
}
function atualizarAvisos() { pegarJSON("avisos.json", function (j) { ultimosAvisos = j.avisos || []; desenharAvisos(); }); }

/* ======== SOM ======== */
var audioCtx = null, bipando = null;
function liberarSom() {
  if (audioCtx) return;
  var AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  audioCtx = new AC();
  var o = audioCtx.createOscillator(), g = audioCtx.createGain();
  g.gain.value = 0; o.connect(g); g.connect(audioCtx.destination);
  if (o.start) o.start(0); else o.noteOn(0);
  if (o.stop) o.stop(audioCtx.currentTime + 0.05); else o.noteOff(audioCtx.currentTime + 0.05);
}
function bip() {
  if (!audioCtx) return;
  var agora = audioCtx.currentTime, k, notas = [784, 988, 1175];
  for (k = 0; k < 3; k++) {
    var o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.frequency.value = notas[k]; g.gain.value = 0.45;
    o.connect(g); g.connect(audioCtx.destination);
    var ini = agora + k * 0.22;
    if (o.start) o.start(ini); else o.noteOn(ini);
    if (o.stop) o.stop(ini + 0.16); else o.noteOff(ini + 0.16);
  }
}

/* ======== TIMER ======== */
var timer = { resta: 0, rodando: false, alvo: 0, fim: false };
function acaoTimer(a) {
  if (a === "play") {
    if (timer.rodando) { timer.resta = Math.max(0, timer.alvo - Date.now()); timer.rodando = false; }
    else if (timer.resta > 0) { timer.alvo = Date.now() + timer.resta; timer.rodando = true; }
  } else if (a === "zero") {
    timer.rodando = false; timer.resta = 0; timer.fim = false;
  } else {
    var mais = parseInt(a, 10) * 60000;
    if (timer.rodando) timer.alvo += mais; else timer.resta += mais;
  }
  desenharTimer();
}
function desenharTimer() {
  var ms = timer.rodando ? Math.max(0, timer.alvo - Date.now()) : timer.resta;
  var s = Math.ceil(ms / 1000), m = Math.floor(s / 60);
  $("tTempo").innerHTML = m >= 60 ? Math.floor(m / 60) + ":" + dois(m % 60) + ":" + dois(s % 60) : dois(m) + ":" + dois(s % 60);
  $("timer").className = "timer" + (timer.rodando ? " rodando" : "");
  $("tPlay").innerHTML = timer.rodando ? "❚❚" : "▶︎";
}
function tickTimer() {
  if (timer.rodando && Date.now() >= timer.alvo) {
    timer.rodando = false; timer.resta = 0; timer.fim = true;
    $("alarme").style.display = "block";
    bip(); if (!bipando) bipando = setInterval(bip, 1400);
  }
  desenharTimer();
}
function pararAlarme() {
  $("alarme").style.display = "none";
  if (bipando) { clearInterval(bipando); bipando = null; }
  timer.fim = false; desenharTimer();
}

/* ======== LISTA DE COMPRAS ======== */
var lista = [];
try { lista = JSON.parse(localStorage.getItem("listaCompras") || "[]"); } catch (e) { lista = []; }
function salvarLista() { try { localStorage.setItem("listaCompras", JSON.stringify(lista)); } catch (e) {} }
function desenharLista() {
  var box = $("itens"), i;
  box.innerHTML = "";
  if (!lista.length) { box.innerHTML = '<div class="vazio">Nada na lista por enquanto. 🛒</div>'; return; }
  for (i = 0; i < lista.length; i++) {
    (function (idx) {
      var d = document.createElement("div");
      d.className = "item" + (lista[idx].feito ? " feito" : "");
      d.appendChild(document.createTextNode(lista[idx].txt));
      toque(d, function () { lista[idx].feito = !lista[idx].feito; salvarLista(); desenharLista(); });
      box.appendChild(d);
    })(i);
  }
}
function adicionarItem() {
  var inp = $("novoItem"), v = inp.value.replace(/^\s+|\s+$/g, "");
  if (!v) return;
  lista.push({ txt: v, feito: false });
  inp.value = ""; salvarLista(); desenharLista();
}

/* ======== INÍCIO ======== */
(function () {
  var btns = $("timer").getElementsByClassName("btn"), i;
  for (i = 0; i < btns.length; i++) (function (b) { toque(b, function () { liberarSom(); acaoTimer(b.getAttribute("data-a")); }); })(btns[i]);
})();
toque($("btnAdd"), adicionarItem);
$("novoItem").addEventListener("keyup", function (e) { if (e.keyCode === 13) { adicionarItem(); this.blur(); } }, false);
toque($("btnLimpar"), function () {
  var nova = [], i;
  for (i = 0; i < lista.length; i++) if (!lista[i].feito) nova.push(lista[i]);
  lista = nova; salvarLista(); desenharLista();
});
toque($("alarme"), pararAlarme);
toque($("apagado"), function () { acordadoAte = Date.now() + 60000; relogio(); });
toque($("mascote"), function () {
  // toque no bichinho = ele dá um pulinho extra
  var m = $("mascote"); m.style.webkitAnimation = "festa .5s ease-in-out 3";
  setTimeout(function () { m.style.webkitAnimation = ""; }, 1600);
});
document.addEventListener("touchstart", liberarSom, false);

desenharLista(); desenharTimer();
relogio(); setInterval(relogio, 1000);
setInterval(tickTimer, 250);
atualizarClima(); setInterval(atualizarClima, 15 * 60 * 1000);
atualizarDia(); setInterval(atualizarDia, 30 * 60 * 1000);
atualizarAvisos(); setInterval(atualizarAvisos, 5 * 60 * 1000);

// recarrega às 4h para o iPad antigo não acumular memória (e pegar versões novas do painel)
setInterval(function () {
  var d = new Date();
  if (d.getHours() === 4 && d.getMinutes() === 0 && !timer.rodando) location.reload();
}, 60000);
</script>
